<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="initial-scale=1, user-scalable=no, maximum-scale=1, width=device-width" />
  <title>Solar Village Map — Fixed UI (Locate / Layers / Measure)</title>

  <!-- Core styles (use your existing paths) -->
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/L.Control.Layers.Tree.css" />
  <link rel="stylesheet" href="css/leaflet-measure.css" />
  <link rel="stylesheet" href="css/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="css/qgis2web.css" />

  <style>
    html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }

    /* Bottom action bar (existing class name retained) */
    .sv-actionbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex; gap: 10px; align-items: center; justify-content: space-around;
      padding: 10px 12px;
      background: rgba(20, 20, 24, 0.92);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.25);
      z-index: 1000;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .sv-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 64px; height: 42px; padding: 0 12px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #fff; font: 600 14px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    .sv-btn:active { transform: translateY(1px); }
    #gps-status { color: #cbd5e1; font-size: 12px; opacity: .9; }

    /* Layers panel must not overlap bottom bar */
    :root { --sv-actionbar-h: 68px; } /* JS will update this dynamically */
    .leaflet-control-layers { margin-bottom: calc(var(--sv-actionbar-h) + 8px); z-index: 1001; }
    .leaflet-right .leaflet-control-layers-expanded {
      max-height: calc(100vh - var(--sv-actionbar-h) - 24px);
      overflow: auto;
    }
    .leaflet-bottom.leaflet-left { margin-bottom: calc(var(--sv-actionbar-h) + 8px); }

    /* Ensure measure UI is above everything */
    .leaflet-control-measure,
    .leaflet-measure-resultpopup,
    .leaflet-control-measure .results { z-index: 1002; }

    /* Simple dropdown for measure actions */
    .sv-measure-menu {
      position: fixed; right: 12px; bottom: calc(var(--sv-actionbar-h) + 12px);
      background: #101216; color: #fff; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 8px; display: none; z-index: 1001;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .sv-measure-menu.show { display: block; }
    .sv-measure-menu .sv-btn { width: 100%; margin: 4px 0; }

    /* Camera mini-pane (placeholder styles; optional) */
    #camera-wrap { position: fixed; left: 12px; bottom: calc(var(--sv-actionbar-h) + 12px); display: none; z-index: 1001; }
    #camera-wrap.show { display: block; }
    #cam-video { width: 240px; height: 160px; background: #000; border-radius: 10px; }
    #cam-canvas { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Bottom action bar -->
  <div class="sv-actionbar">
    <button id="btn-locate" class="sv-btn">Locate</button>
    <button id="btn-add-pin" class="sv-btn">Add Pin</button>
    <button id="btn-camera" class="sv-btn">Photo</button>
    <button id="btn-measure" class="sv-btn">Measure</button>
    <span id="gps-status">status: ready</span>
  </div>

  <!-- Measure dropdown -->
  <div id="measure-menu" class="sv-measure-menu">
    <button id="btn-measure-dist" class="sv-btn">Distance</button>
    <button id="btn-measure-area" class="sv-btn">Area</button>
    <button id="btn-measure-clear" class="sv-btn">Clear</button>
  </div>

  <!-- Camera (placeholder container if you wire it later) -->
  <div id="camera-wrap">
    <video id="cam-video" autoplay playsinline></video><br/>
    <button id="btn-camera-shot" class="sv-btn">Snap</button>
    <button id="btn-camera-off" class="sv-btn">Close</button>
    <canvas id="cam-canvas"></canvas>
  </div>

  <!-- Scripts: use your existing local copies -->
  <script src="js/leaflet.js"></script>
  <script src="js/L.Control.Layers.Tree.min.js"></script>
  <script src="js/leaflet-measure.min.js"></script>
  <script src="js/L.Control.Locate.min.js"></script>
  <!-- NOTE: leaflet.pattern.js is intentionally NOT loaded to avoid the Mixin warning -->

  <script>
    // Make state/ui/status globally visible so helper blocks can safely access them
    window.state = { lastFix: null, dropPinArmed: false, cam: { stream: null }, gpsMarker: null, gpsCircle: null };

    document.addEventListener('DOMContentLoaded', function () {
      // Basic map init (replace with your original center/tiles)
      var map = window.map = L.map('map', { zoomControl: true }).setView([49.887, -119.496], 12);

      // Base layer (swap to your tiles)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Layers control (placeholder; add your layer tree/groups)
      var overlays = {}; // e.g., { "Pins": pinsLayer, "Photos": photosLayer }
      var layersCtl = L.control.layers.tree(null, overlays, { collapsed: true }).addTo(map);

      // Measure control
      var measureControl = window.measureControl = new L.Control.Measure({
        position: 'topright',
        primaryLengthUnit: 'meters',
        secondaryLengthUnit: 'kilometers',
        primaryAreaUnit: 'sqmeters',
        secondaryAreaUnit: 'hectares'
      });
      measureControl.addTo(map);

      // Locate: draw blue dot + accuracy ring
      function drawFix(latlng, acc) {
        if (state.gpsMarker) map.removeLayer(state.gpsMarker);
        state.gpsMarker = L.circleMarker(latlng, {
          radius: 6, color: '#0078ff', fillColor: '#0078ff', fillOpacity: 1
        }).addTo(map).bindPopup('You are here');

        if (state.gpsCircle) map.removeLayer(state.gpsCircle);
        state.gpsCircle = L.circle(latlng, {
          radius: Math.max(acc || 0, 0),
          color: '#0078ff', weight: 1, fillOpacity: 0.10
        }).addTo(map);
      }

      map.on('locationfound', function (e) {
        drawFix(e.latlng, e.accuracy);
        state.lastFix = { time: Date.now(), lat: e.latlng.lat, lng: e.latlng.lng, acc: e.accuracy };
        setStatus('fix @ ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5) + ' (±' + Math.round(e.accuracy) + ' m)');
      });
      map.on('locationerror', function (e) {
        setStatus('error: ' + e.message);
        alert('Location error: ' + e.message);
      });

      // UI shortcuts
      var ui = window.ui = {
        status: document.getElementById('gps-status'),
        btnLocate: document.getElementById('btn-locate'),
        btnAddPin: document.getElementById('btn-add-pin'),
        btnCamera: document.getElementById('btn-camera'),
        btnMeasure: document.getElementById('btn-measure'),
        btnLayers: null, // if you have a custom layers toggle
        btnCamShot: document.getElementById('btn-camera-shot'),
        btnCamOff: document.getElementById('btn-camera-off'),
        camWrap: document.getElementById('camera-wrap'),
        video: document.getElementById('cam-video'),
        canvas: document.getElementById('cam-canvas'),
        measureMenu: document.getElementById('measure-menu'),
        measureDist: document.getElementById('btn-measure-dist'),
        measureArea: document.getElementById('btn-measure-area'),
        measureClear: document.getElementById('btn-measure-clear')
      };

      window.setStatus = function (m) { ui.status.textContent = 'status: ' + m; };

      // Locate button
      ui.btnLocate.onclick = function () {
        // disarm Pin if you implement disarmPinDrop()
        try { if (typeof disarmPinDrop === 'function') disarmPinDrop(); } catch(e) {}
        map.locate({ setView: true, maxZoom: 18, enableHighAccuracy: true, timeout: 10000, watch: false });
      };

      // Measure dropdown toggle
      ui.btnMeasure.onclick = function () {
        ui.measureMenu.classList.toggle('show');
      };

      // Ensure the measure toolbars are ready before toggling tools
      function ensureMeasureReady() {
        if (!window.measureControl) return false;
        if (!measureControl._toolbars || !measureControl._toolbars.distance) {
          try {
            if (typeof measureControl._toggleMeasure === 'function') {
              measureControl._toggleMeasure(); measureControl._toggleMeasure();
            }
          } catch (e) {}
        }
        return !!(measureControl._toolbars && measureControl._toolbars.distance);
      }

      function triggerMeasure(action) {
        if (!ensureMeasureReady()) { console.warn('Measure not ready'); return; }
        var tb = measureControl._toolbars[action];
        if (!tb) return;
        if (tb._active) tb.disable(); else tb.enable();
        ui.measureMenu.classList.remove('show');
      }

      ui.measureDist.onclick  = function () { triggerMeasure('distance'); };
      ui.measureArea.onclick  = function () { triggerMeasure('area'); };
      ui.measureClear.onclick = function () {
        if (!ensureMeasureReady()) return;
        var clearer = (measureControl.clearAllMeasurements || measureControl._clearAllMeasurements || function(){});
        try { clearer.call(measureControl); } catch (e) {}
        ui.measureMenu.classList.remove('show');
      };

      // Keep CSS var in sync with actual actionbar height (prevents overlap)
      (function () {
        var bar = document.querySelector('.sv-actionbar');
        function updateSpace() {
          var h = bar ? bar.offsetHeight : 68;
          document.documentElement.style.setProperty('--sv-actionbar-h', h + 'px');
        }
        if (bar && 'ResizeObserver' in window) {
          new ResizeObserver(updateSpace).observe(bar);
          updateSpace();
        } else {
          updateSpace();
          window.addEventListener('resize', updateSpace);
        }
      })();

      // --- OPTIONAL: add your existing data layers here and register in 'overlays'
      // Example:
      // var pinsLayer = L.featureGroup().addTo(map);
      // overlays["Pins"] = pinsLayer;
      // layersCtl.setOverlayTree(null, overlays);
    });
  </script>
</body>
</html>
