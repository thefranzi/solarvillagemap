<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="initial-scale=1, width=device-width, maximum-scale=1, user-scalable=no" />

  <title>Solar Village Map</title>

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/L.Control.Layers.Tree.css" />
  <link rel="stylesheet" href="css/leaflet-measure.css" />
  <link rel="stylesheet" href="css/L.Control.Locate.min.css" />
  <link rel="stylesheet" href="css/qgis2web.css" />
  <link rel="stylesheet" href="css/fontawesome-all.min.css" />

  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }

    /* Bottom action bar */
    .sv-actionbar{
      position:fixed; left:8px; right:8px;
      bottom: env(safe-area-inset-bottom,8px);
      display:grid; grid-template-columns:repeat(5,1fr);
      gap:10px; background:rgba(255,255,255,.9);
      padding:8px; border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.15);
      z-index:1000;
    }
    .sv-act{ display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-width:44px; min-height:44px; padding:6px 4px; border:none; border-radius:12px; background:#fff; cursor:pointer; }
    .sv-act i{ font-size:18px; line-height:1; }
    .sv-act span{ font-size:11px; margin-top:4px; }
    @media (max-width:420px){ .sv-act span{ display:none; } }

    /* Space default Leaflet bottom-left controls from the bar */
    .leaflet-bottom.leaflet-left{ margin-bottom: 68px; }

    /* Layers panel never overlaps the bottom bar */
    :root{ --sv-actionbar-h: 68px; }
    .leaflet-control-layers{ margin-bottom: calc(var(--sv-actionbar-h) + 8px); z-index:1001; }
    .leaflet-right .leaflet-control-layers-expanded{
      max-height: calc(100vh - var(--sv-actionbar-h) - 24px);
      overflow:auto;
    }

    /* Measure UI above toolbar */
    .leaflet-control-measure,
    .leaflet-measure-resultpopup,
    .leaflet-control-measure .results{ z-index:1200; }

    /* Small logo top-left, defeat global img width rules */
    .leaflet-control-logo.leaflet-control{ background:transparent; border:0; box-shadow:none; padding:4px; }
    .leaflet-top.leaflet-left .leaflet-control-logo{ margin-top:8px; margin-left:8px; }
    .leaflet-control-logo img#sv-logo{
      width:110px !important; height:auto !important; max-height:40px !important; max-width:none !important; display:block !important;
    }
    .leaflet-control img{ width:auto !important; height:auto !important; max-width:100%; max-height:100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Bottom Action Bar -->
  <div id="actionbar" class="sv-actionbar">
    <button id="btn-locate" class="sv-act" title="Locate"><i class="fas fa-crosshairs"></i><span>Locate</span></button>
    <button id="btn-add-pin" class="sv-act" title="Add Pin"><i class="fas fa-map-pin"></i><span>Add Pin</span></button>
    <button id="btn-camera" class="sv-act" title="Photo"><i class="fas fa-camera"></i><span>Photo</span></button>
    <button id="btn-measure" class="sv-act" title="Measure"><i class="fas fa-ruler-combined"></i><span>Measure</span></button>
    <button id="btn-layers" class="sv-act" title="Layers"><i class="fas fa-layer-group"></i><span>Layers</span></button>
  </div>

  <!-- Core JS (local). Order matters -->
  <script src="js/qgis2web_expressions.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/leaflet.markercluster.js"></script>
  <script src="js/L.Control.Layers.Tree.min.js"></script>
  <script src="js/leaflet-measure.js"></script>
  <script src="js/L.Control.Locate.min.js"></script>
  <script src="js/multi-style-layer.js"></script>
  <script src="js/leaflet.rotatedMarker.js"></script>
  <!-- Do NOT include leaflet.pattern.js (deprecated mixin warning) -->
  <script src="js/leaflet-hash.js"></script>
  <script src="js/Autolinker.min.js"></script>
  <script src="js/rbush.min.js"></script>
  <script src="js/labelgun.min.js"></script>
  <script src="js/labels.js"></script>

  <!-- DATA LAYERS (local). Keep these as in your export -->
  <script src="data/BNDRY_4.js"></script>
  <script src="data/LOTS_5.js"></script>
  <script src="data/ESA_7.js"></script>
  <script src="data/DW_8.js"></script>
  <script src="data/SBE_9.js"></script>
  <script src="data/EX_BLD_10.js"></script>
  <script src="data/CRK_COV_11.js"></script>
  <script src="data/ENV_RST_12.js"></script>
  <script src="data/SRW_MOTI_13.js"></script>
  <script src="data/CE_14.js"></script>
  <script src="data/BA_15.js"></script>
  <script src="data/ALR_16.js"></script>
  <script src="data/AOI_17.js"></script>
  <script src="data/SEPTIC_18.js"></script>
  <script src="data/WELLS_19.js"></script>
  <script src="data/FENCE_20.js"></script>
  <script src="data/EX_FENCE_21.js"></script>
  <!-- Lazy-loaded: contours -->
  <!-- <script src="data/CONT_6.js" defer></script> -->

  <script>
    // ==== Map init ====
    const map = L.map('map', { zoomControl: false, maxZoom: 21, minZoom: 15 })
      .fitBounds([[49.954011553509815,-119.33922884315004],[49.961783579330934,-119.32957344118267]]);

    // hash + attribution
    new L.Hash(map);
    map.attributionControl.setPrefix(
      '<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> · ' +
      '<a href="https://leafletjs.com" target="_blank">Leaflet</a> · ' +
      '<a href="https://qgis.org" target="_blank">QGIS</a>'
    );

    // Base layers
    map.createPane('pane_WorldImagery_3'); map.getPane('pane_WorldImagery_3').style.zIndex = 403;
    const layer_WorldImagery_3 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      pane: 'pane_WorldImagery_3', maxZoom: 21, minZoom: 15
    }).addTo(map);
    map.createPane('pane_GoogleSatellite_2'); map.getPane('pane_GoogleSatellite_2').style.zIndex = 402;
    const layer_GoogleSatellite_2 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { pane: 'pane_GoogleSatellite_2', maxZoom: 21, minZoom: 15 });
    map.createPane('pane_OSM_1'); map.getPane('pane_OSM_1').style.zIndex = 401;
    const layer_OSM_1 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { pane: 'pane_OSM_1', maxZoom: 21, minZoom: 15 });
    map.createPane('pane_GoogleMaps_0'); map.getPane('pane_GoogleMaps_0').style.zIndex = 400;
    const layer_GoogleMaps_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { pane: 'pane_GoogleMaps_0', maxZoom: 21, minZoom: 15 });

    // Measure control (built-in UI; we just toggle it from the bottom bar)
    const measureControl = new L.Control.Measure({
      position: 'topleft',
      primaryLengthUnit: 'meters',
      secondaryLengthUnit: 'kilometers',
      primaryAreaUnit: 'sqmeters',
      secondaryAreaUnit: 'hectares'
    }).addTo(map);

    // Locate control (optional extra control up top; bottom button also uses map.locate)
    L.control.locate({ position: 'topleft', setView: 'once', flyTo: true, drawCircle: false, showPopup: false }).addTo(map);

    // ---- User layers placeholders (you can populate pins/photos if you have them) ----
    const pinsLayer = L.featureGroup().addTo(map);
    const photosLayer = L.featureGroup().addTo(map);

    // ---- Vector panes + layers from your data (styles same as your export) ----
    function pop_NOP(feature, layer) {}
    function style_BNDRY_4_0(){ return { pane:'pane_BNDRY_4', opacity:1, color:'rgba(0,0,0,1.0)', weight:4, fillOpacity:0, interactive:false}; }
    map.createPane('pane_BNDRY_4'); map.getPane('pane_BNDRY_4').style.zIndex=404;
    const layer_BNDRY_4 = new L.geoJson(json_BNDRY_4,{pane:'pane_BNDRY_4', style:style_BNDRY_4_0, interactive:false, onEachFeature:pop_NOP}).addTo(map);

    function style_LOTS_5_0(){ return { pane:'pane_LOTS_5', opacity:1, color:'rgba(35,35,35,1.0)', weight:6, fillOpacity:0, interactive:true}; }
    map.createPane('pane_LOTS_5'); map.getPane('pane_LOTS_5').style.zIndex=405;
    const layer_LOTS_5 = new L.geoJson(json_LOTS_5,{pane:'pane_LOTS_5', style:style_LOTS_5_0, interactive:true}).addTo(map);

    map.createPane('pane_CONT_6'); map.getPane('pane_CONT_6').style.zIndex=406;
    const layer_CONT_6 = L.layerGroup(); layer_CONT_6.__loaded=false;

    function style_ESA_7_0(f){
      switch(String(f.properties['ESA_ZONE'])){
        case '1': return {pane:'pane_ESA_7', color:'rgba(0,0,0,0.55)', weight:2, fill:true, fillOpacity:1, fillColor:'rgba(150,0,0,0.431)', interactive:true};
        case '2': return {pane:'pane_ESA_7', color:'rgba(0,0,0,0.55)', weight:2, fill:true, fillOpacity:1, fillColor:'rgba(200,50,0,0.431)', interactive:true};
        case '3': return {pane:'pane_ESA_7', color:'rgba(0,0,0,0.55)', weight:2, fill:true, fillOpacity:1, fillColor:'rgba(255,165,0,0.431)', interactive:true};
        case '4': return {pane:'pane_ESA_7', color:'rgba(0,0,0,0.55)', weight:2, fill:true, fillOpacity:1, fillColor:'rgba(255,255,0,0.431)', interactive:true};
      }
    }
    map.createPane('pane_ESA_7'); map.getPane('pane_ESA_7').style.zIndex=407;
    const layer_ESA_7 = new L.geoJson(json_ESA_7,{pane:'pane_ESA_7', style:style_ESA_7_0, interactive:true});

    function style_DW_8_0(){ return { pane:'pane_DW_8', color:'rgba(229,182,54,1.0)', weight:1, fillOpacity:0, interactive:false}; }
    map.createPane('pane_DW_8'); map.getPane('pane_DW_8').style.zIndex=408;
    const layer_DW_8 = new L.geoJson(json_DW_8,{pane:'pane_DW_8', style:style_DW_8_0, interactive:false}).addTo(map);

    function style_SBE_9_0(){ return { pane:'pane_SBE_9', color:'rgba(203,0,255,0.39)', dashArray:'8,4,2,4', weight:2, fillOpacity:0, interactive:false}; }
    function style_SBE_9_1(){ return { pane:'pane_SBE_9', color:'rgba(35,35,35,0.39)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(251,230,255,0.39)', interactive:false}; }
    map.createPane('pane_SBE_9'); map.getPane('pane_SBE_9').style.zIndex=409;
    const layer_SBE_9 = new L.geoJson.multiStyle(json_SBE_9,{pane:'pane_SBE_9', styles:[style_SBE_9_0, style_SBE_9_1], interactive:false}).addTo(map);

    function style_EX_BLD_10_0(){ return { pane:'pane_EX_BLD_10', color:'rgba(203,0,255,0.573)', weight:3, fillOpacity:0, interactive:false}; }
    function style_EX_BLD_10_1(){ return { pane:'pane_EX_BLD_10', color:'rgba(35,35,35,0.573)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(251,230,255,0.573)', interactive:false}; }
    map.createPane('pane_EX_BLD_10'); map.getPane('pane_EX_BLD_10').style.zIndex=410;
    const layer_EX_BLD_10 = new L.geoJson.multiStyle(json_EX_BLD_10,{pane:'pane_EX_BLD_10', styles:[style_EX_BLD_10_0, style_EX_BLD_10_1], interactive:false}).addTo(map);

    function style_CRK_COV_11_0(){ return { pane:'pane_CRK_COV_11', color:'rgba(169,0,0,0.41)', weight:3, fill:true, fillOpacity:1, fillColor:'rgba(60,146,155,0.41)', interactive:false}; }
    map.createPane('pane_CRK_COV_11'); map.getPane('pane_CRK_COV_11').style.zIndex=411;
    const layer_CRK_COV_11 = new L.geoJson(json_CRK_COV_11,{pane:'pane_CRK_COV_11', style:style_CRK_COV_11_0, interactive:false}).addTo(map);

    function style_ENV_RST_12_0(){ return { pane:'pane_ENV_RST_12', color:'rgba(255,87,33,0.389)', weight:2, fill:true, fillOpacity:1, fillColor:'rgba(188,240,183,0.389)', interactive:false}; }
    map.createPane('pane_ENV_RST_12'); map.getPane('pane_ENV_RST_12').style.zIndex=412;
    const layer_ENV_RST_12 = new L.geoJson(json_ENV_RST_12,{pane:'pane_ENV_RST_12', style:style_ENV_RST_12_0, interactive:false}).addTo(map);

    function style_SRW_MOTI_13_0(){ return { pane:'pane_SRW_MOTI_13', color:'rgba(35,35,35,0.383)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(255,157,157,0.383)', interactive:false}; }
    map.createPane('pane_SRW_MOTI_13'); map.getPane('pane_SRW_MOTI_13').style.zIndex=413;
    const layer_SRW_MOTI_13 = new L.geoJson(json_SRW_MOTI_13,{pane:'pane_SRW_MOTI_13', style:style_SRW_MOTI_13_0, interactive:false}).addTo(map);

    function style_CE_14_0(){ return { pane:'pane_CE_14', color:'rgba(35,35,229,0.199)', weight:8, fill:true, fillOpacity:1, fillColor:'rgba(206,252,255,0.199)', interactive:true}; }
    map.createPane('pane_CE_14'); map.getPane('pane_CE_14').style.zIndex=414;
    const layer_CE_14 = new L.geoJson(json_CE_14,{pane:'pane_CE_14', style:style_CE_14_0, interactive:true}).addTo(map);

    function style_BA_15_0(){ return { pane:'pane_BA_15', color:'rgba(0,255,155,0.843)', weight:2, fillOpacity:0, interactive:false}; }
    map.createPane('pane_BA_15'); map.getPane('pane_BA_15').style.zIndex=415;
    const layer_BA_15 = new L.geoJson(json_BA_15,{pane:'pane_BA_15', style:style_BA_15_0, interactive:false}).addTo(map);

    function style_ALR_16_0(){ return { pane:'pane_ALR_16', color:'rgba(35,83,35,0.376)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(207,0,0,0.376)', interactive:false}; }
    map.createPane('pane_ALR_16'); map.getPane('pane_ALR_16').style.zIndex=416;
    const layer_ALR_16 = new L.geoJson(json_ALR_16,{pane:'pane_ALR_16', style:style_ALR_16_0, interactive:false}).addTo(map);

    function style_AOI_17_0(f){
      switch(String(f.properties['AOI_STATUS'])){
        case 'Cleared':     return {pane:'pane_AOI_17', color:'rgba(0,0,0,0.535)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(0,170,0,0.357)', interactive:true};
        case 'Not Cleared': return {pane:'pane_AOI_17', color:'rgba(0,0,0,0.535)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(200,0,0,0.357)', interactive:true};
      }
    }
    map.createPane('pane_AOI_17'); map.getPane('pane_AOI_17').style.zIndex=417;
    const layer_AOI_17 = new L.geoJson(json_AOI_17,{pane:'pane_AOI_17', style:style_AOI_17_0, interactive:true}).addTo(map);

    function style_SEPTIC_18_0(){ return { pane:'pane_SEPTIC_18', color:'rgba(35,35,35,0.9)', weight:1, fill:true, fillOpacity:1, fillColor:'rgba(122,115,93,0.9)', interactive:true}; }
    map.createPane('pane_SEPTIC_18'); map.getPane('pane_SEPTIC_18').style.zIndex=418;
    const layer_SEPTIC_18 = new L.geoJson(json_SEPTIC_18,{pane:'pane_SEPTIC_18', style:style_SEPTIC_18_0, interactive:true}).addTo(map);

    function style_WELLS_19_0(){ return { pane:'pane_WELLS_19', color:'rgba(35,35,255,1.0)', weight:6, fill:true, fillOpacity:1, fillColor:'rgba(53,0,255,1.0)', interactive:true}; }
    map.createPane('pane_WELLS_19'); map.getPane('pane_WELLS_19').style.zIndex=419;
    const layer_WELLS_19 = new L.geoJson(json_WELLS_19,{pane:'pane_WELLS_19', style:style_WELLS_19_0, interactive:true}).addTo(map);

    function style_FENCE_20_0(){ return { pane:'pane_FENCE_20', color:'rgba(234,255,35,0.647)', dashArray:'3,6', weight:3, fillOpacity:0, interactive:true}; }
    map.createPane('pane_FENCE_20'); map.getPane('pane_FENCE_20').style.zIndex=420;
    const layer_FENCE_20 = new L.geoJson(json_FENCE_20,{pane:'pane_FENCE_20', style:style_FENCE_20_0, interactive:true}).addTo(map);

    function style_EX_FENCE_21_0(){ return { pane:'pane_EX_FENCE_21', color:'rgba(185,202,28,0.728)', dashArray:'3,6', weight:3, fillOpacity:0, interactive:true}; }
    map.createPane('pane_EX_FENCE_21'); map.getPane('pane_EX_FENCE_21').style.zIndex=421;
    const layer_EX_FENCE_21 = new L.geoJson(json_EX_FENCE_21,{pane:'pane_EX_FENCE_21', style:style_EX_FENCE_21_0, interactive:true}).addTo(map);

    // Layer tree
    const overlaysTree = [
      {label:'<b>User Content</b>', selectAllCheckbox:true, children:[
        {label:'<i class="fas fa-map-pin" style="color:#ff8c00;margin-right:5px;"></i> User Pins', layer:pinsLayer},
        {label:'<i class="fas fa-camera" style="color:#7e57c2;margin-right:5px;"></i> User Photos', layer:photosLayer}
      ]},
      {label:'<b>Solar Village v22</b>', selectAllCheckbox:true, children:[
        {label:'<img src="legend/EX_FENCE_21.png" /> EX_FENCE', layer:layer_EX_FENCE_21},
        {label:'<img src="legend/FENCE_20.png" /> FENCE', layer:layer_FENCE_20},
        {label:'<img src="legend/WELLS_19.png" /> WELLS', layer:layer_WELLS_19},
        {label:'<img src="legend/SEPTIC_18.png" /> SEPTIC', layer:layer_SEPTIC_18},
        {label:'AOI<br /><table><tr><td style="text-align:center;"><img src="legend/AOI_17_Cleared0.png" /></td><td>Cleared</td></tr><tr><td style="text-align:center;"><img src="legend/AOI_17_NotCleared1.png" /></td><td>Not Cleared</td></tr></table>', layer:layer_AOI_17},
        {label:'<img src="legend/ALR_16.png" /> ALR', layer:layer_ALR_16},
        {label:'<img src="legend/BA_15.png" /> BA', layer:layer_BA_15},
        {label:'<img src="legend/CE_14.png" /> CE', layer:layer_CE_14},
        {label:'<img src="legend/SRW_MOTI_13.png" /> SRW_MOTI', layer:layer_SRW_MOTI_13},
        {label:'<img src="legend/ENV_RST_12.png" /> ENV_RST', layer:layer_ENV_RST_12},
        {label:'<img src="legend/CRK_COV_11.png" /> CRK_COV', layer:layer_CRK_COV_11},
        {label:'<img src="legend/EX_BLD_10.png" /> EX_BLD', layer:layer_EX_BLD_10},
        {label:'<img src="legend/SBE_9.png" /> SBE', layer:layer_SBE_9},
        {label:'<img src="legend/DW_8.png" /> DW', layer:layer_DW_8},
        {label:'ESA<br /><table><tr><td style="text-align:center;"><img src="legend/ESA_7_Zone10.png"/></td><td>Zone 1</td></tr><tr><td style="text-align:center;"><img src="legend/ESA_7_Zone21.png"/></td><td>Zone 2</td></tr><tr><td style="text-align:center;"><img src="legend/ESA_7_Zone32.png"/></td><td>Zone 3</td></tr><tr><td style="text-align:center;"><img src="legend/ESA_7_Zone43.png"/></td><td>Zone 4</td></tr></table>', layer:layer_ESA_7},
        {label:'<img src="legend/CONT_6.png" /> CONT', layer:layer_CONT_6},
        {label:'<img src="legend/LOTS_5.png" /> LOTS', layer:layer_LOTS_5},
        {label:'<img src="legend/BNDRY_4.png" /> BNDRY', layer:layer_BNDRY_4}
      ]},
      {label:'<b>Baselayers</b>', selectAllCheckbox:true, children:[
        {label:'World Imagery', layer:layer_WorldImagery_3, radioGroup:'bm'},
        {label:'Google Satellite', layer:layer_GoogleSatellite_2, radioGroup:'bm'},
        {label:'OSM', layer:layer_OSM_1, radioGroup:'bm'},
        {label:'Google Maps', layer:layer_GoogleMaps_0, radioGroup:'bm'}
      ]}
    ];
    const lay = L.control.layers.tree(null, overlaysTree, { collapsed:true }).addTo(map);

    // Small logo control (hard-capped image)
    L.Control.Logo = L.Control.extend({
      onAdd: function(map){
        const c = L.DomUtil.create('div', 'leaflet-control-logo leaflet-control');
        c.innerHTML = '<a href="https://www.solarvillage.ca" target="_blank" rel="noopener"><img id="sv-logo" src="solarvilla.png" alt="Solar Village" /></a>';
        L.DomEvent.disableClickPropagation(c);
        return c;
      }
    });
    new L.Control.Logo({ position:'topleft' }).addTo(map);

    // LOTS labels (as in your export)
    let i = 0;
    layer_LOTS_5.eachLayer(function(layer){
      layer.bindTooltip((layer.feature.properties['Text'] || ''), {permanent:true, offset:[-0,-16], className:'css_LOTS_5'});
      labels.push(layer); totalMarkers += 1; layer.added = true; addLabel(layer, i++);
    });
    resetLabels([layer_LOTS_5]);
    map.on('zoomend layeradd layerremove', function(){ resetLabels([layer_LOTS_5]); });

    // Lazy-load contours when enabled
    function loadScriptOnce(url){
      return new Promise((resolve, reject)=>{
        if (document.querySelector(`script[src="${url}"]`)) return resolve();
        const s = document.createElement('script'); s.src=url; s.async=true;
        s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
      });
    }
    async function ensureContoursLoaded(){
      if (layer_CONT_6.__loaded) return;
      try{
        await loadScriptOnce('data/CONT_6.js');
        if (typeof json_CONT_6 === 'undefined') return;
        const nl = new L.geoJson(json_CONT_6,{pane:'pane_CONT_6', style:()=>({pane:'pane_CONT_6', opacity:1, color:'rgba(243,166,178,1.0)', weight:1, fillOpacity:0, interactive:true})});
        nl.eachLayer(l=>layer_CONT_6.addLayer(l)); layer_CONT_6.__loaded=true;
      }catch(e){ console.error('[contours] load error', e); }
    }
    map.on('overlayadd', e => { if (e.layer === layer_CONT_6) ensureContoursLoaded(); });

    // ===== Bottom bar wiring =====
    // Keep CSS var synced with actual bar height
    (function keepBottomSpace(){
      const bar = document.getElementById('actionbar');
      function upd(){ if (bar) document.documentElement.style.setProperty('--sv-actionbar-h', bar.offsetHeight + 'px'); }
      if ('ResizeObserver' in window && bar) { new ResizeObserver(upd).observe(bar); upd(); }
      else { upd(); window.addEventListener('resize', upd); }
    })();

    // Layers toggle
    document.getElementById('btn-layers').onclick = (e)=>{
      e.stopPropagation();
      const ctl = document.querySelector('.leaflet-control-layers');
      if (ctl) ctl.classList.toggle('leaflet-control-layers-expanded');
    };

    // Measure toggle (click the plugin's own toggle)
    document.getElementById('btn-measure').onclick = (e)=>{
      e.stopPropagation();
      const toggle = document.querySelector('.leaflet-control-measure-toggle');
      if (toggle) toggle.click();
    };

    // Locate: blue dot + accuracy ring
    let gpsMarker=null, gpsCircle=null;
    function drawFix(latlng, acc) {
      if (gpsMarker) map.removeLayer(gpsMarker);
      gpsMarker = L.circleMarker(latlng, { radius:6, color:'#0078ff', fillColor:'#0078ff', fillOpacity:1 }).addTo(map).bindPopup('You are here');
      if (gpsCircle) map.removeLayer(gpsCircle);
      gpsCircle = L.circle(latlng, { radius: Math.max(acc||0,0), color:'#0078ff', weight:1, fillOpacity:0.10 }).addTo(map);
    }
    map.on('locationfound', (e)=>{ drawFix(e.latlng, e.accuracy); map.setView(e.latlng, Math.max(map.getZoom(), 18)); });
    map.on('locationerror', (e)=>{ console.error('Location error:', e.message); alert('Location error: ' + e.message); });
    document.getElementById('btn-locate').onclick = (e)=>{
      e.stopPropagation();
      try { map.locate({ setView:false, enableHighAccuracy:true, timeout:10000, watch:false }); }
      catch(err){ console.error('map.locate failed', err); }
    };

    // Optional cosmetics: put a ruler icon on the plugin toggle
    const tgl = document.getElementsByClassName('leaflet-control-measure-toggle')[0];
    if (tgl) { tgl.innerHTML = ''; if (!tgl.className.includes('fas')) tgl.className += ' fas fa-ruler'; }
  </script>
</body>
</html>
