function showStatus(message, duration = 3000) {
    console.log("v10: Status: " + message);
    var statusDiv = document.getElementById("status-overlay");
    if (!statusDiv) {
        statusDiv = document.createElement("div");
        statusDiv.id = "status-overlay";
        document.body.appendChild(statusDiv);
    }
    statusDiv.innerHTML = message;
    statusDiv.style.display = "block";
    statusDiv.classList.remove("fade-out");

    setTimeout(() => {

var measureControl = L.Control.extend({
    options: { position: "topleft" },

    onAdd: function(map) {
        var container = L.DomUtil.create("div", "leaflet-bar leaflet-control");
        container.style.backgroundColor = "white";
        container.style.width = "26px";
        container.style.height = "26px";
        container.style.lineHeight = "26px";
        container.style.textAlign = "center";
        container.style.border = "2px solid rgba(0,0,0,0.2)";
        container.innerHTML = "&#128209;";  // Unicode for ðŸ“ (UTF-8 safe)
        container.title = "Measure Distance/Area";
        L.DomEvent.disableClickPropagation(container);

        var started = false;
        var latlngs = [];
        var tempLine, tempPoly;
        var marker1, marker2;

        container.onclick = function(e) {
            L.DomEvent.stopPropagation(e);
            if (started) {
                started = false;
                if (tempLine) map.removeLayer(tempLine);
                if (tempPoly) map.removeLayer(tempPoly);
                if (marker2) map.removeLayer(marker2);
                latlngs = [];
                showStatus("Measurement ended", 2000);
                return;
            }
            started = true;
            latlngs = [];
            showStatus("Click to start measuring; double-click to end", 3000);
        };

        var mapClickHandler = function(e) {
            if (!started) return;
            var latlng = e.latlng;
            latlngs.push(latlng);

            if (latlngs.length === 1) {
                marker1 = L.marker(latlng).addTo(map);
                showStatus("Click next point for distance", 2000);
            } else if (latlngs.length > 1) {
                if (tempLine) map.removeLayer(tempLine);
                tempLine = L.polyline(latlngs, {color: "red", weight: 3}).addTo(map);
                if (latlngs.length === 2) {
                    var distance = latlngs[0].distanceTo(latlngs[1]).toFixed(0) + " m";
                    showStatus("Distance: " + distance + "; click more for area", 3000);
                } else if (latlngs.length > 2) {
                    tempPoly = L.polygon(latlngs, {color: "blue", fillOpacity: 0.2}).addTo(map);
                    var area = 0;
                    for (var i = 0; i < latlngs.length; i++) {
                        var p1 = latlngs[i], p2 = latlngs[(i + 1) % latlngs.length];
                        area += p1.lat * p2.lng - p2.lat * p1.lng;
                    }
                    area = Math.abs(area / 2 / 10000).toFixed(2) + " ha";
                    showStatus("Area approx: " + area + "; double-click end", 3000);
                }
                marker2 = L.marker(latlng).addTo(map);
            }
        };

        var mapDoubleClickHandler = function(e) {
            if (started) {
                container.onclick(e);
            }
        };

        map.on("click", mapClickHandler);
        map.on("dblclick", mapDoubleClickHandler);

        return container;
    },

    onRemove: function(map) {
        map.off("click", mapClickHandler);
        map.off("dblclick", mapDoubleClickHandler);
    }
});
