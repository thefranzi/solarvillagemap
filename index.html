<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/leaflet.css">
  <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
  <link rel="stylesheet" href="css/L.Control.Locate.min.css">
  <link rel="stylesheet" href="css/qgis2web.css">
  <link rel="stylesheet" href="css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/leaflet.photon.css">
  <link rel="stylesheet" href="css/leaflet-measure.css">

  <style>
    html, body, #map { width:100%; height:100%; margin:0; padding:0; }

    /* GPS/Camera/Pins toolbox (top-left) */
    #gpscam-ui {
      position:absolute; z-index:9999; top:10px; left:10px;
      background:rgba(255,255,255,.95); border-radius:8px; padding:8px 8px 6px 8px;
      box-shadow:0 2px 8px rgba(0,0,0,.2);
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;

      /* fixed width + vertical scroll; wrap long status */
      width:300px; max-height:60vh; overflow-y:auto;
    }
    #gpscam-ui .row { display:flex; gap:6px; margin-bottom:4px; flex-wrap:wrap; }
    #gpscam-ui button,#gpscam-ui label{ font-size:13px; }
    #gpscam-ui button { padding:6px 8px; touch-action:manipulation; }
    #gps-status { margin-top:4px; font-size:12px; opacity:.8; white-space:normal; overflow-wrap:anywhere; }

    #camera-wrap { display:none; margin-top:6px; z-index:1000; }
    #camera-wrap.show { display:block; }
    #cam-video {
      width:100%; max-width:280px; aspect-ratio:3/4; background:#000; object-fit:cover; border-radius:6px;
    }
    #cam-canvas { display:none; }
  </style>
  <title>Solar Village Map</title>
</head>
<body>
  <div id="map">
    <div id="gpscam-ui">
      <div class="row">
        <button id="btn-zoom-in" title="Zoom in">＋</button>
        <button id="btn-zoom-out" title="Zoom out">－</button>
        <button id="btn-zoom-extents" title="Zoom to full extent">🗺️</button>
      </div>

      <div class="row">
        <button id="btn-locate-once" title="Center on current location">📍</button>
        <button id="btn-drop-pin"    title="Drop a pin on next map click">📌</button>
        <button id="btn-track-toggle" title="Start/stop continuous GPS tracking">▶️</button>
      </div>

      <div class="row">
        <button id="btn-measure-dist"  title="Measure distance">📏</button>
        <button id="btn-measure-area"  title="Measure area">📐</button>
        <button id="btn-measure-clear" title="Clear measurements">🧹</button>
      </div>

      <div class="row">
        <button id="btn-camera-on"   title="Open device camera">📷</button>
        <button id="btn-camera-shot" title="Take photo" disabled>🖼️</button>
        <button id="btn-camera-off"  title="Stop camera" disabled>⏹️</button>
      </div>

      <div class="row">
        <label style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chk-pins" checked> Pins</label>
        <label style="display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chk-photos" checked> Photos</label>
      </div>

      <div id="camera-wrap">
        <video id="cam-video" autoplay playsinline muted></video>
        <canvas id="cam-canvas"></canvas>
      </div>

      <div class="row" style="margin-top:4px">
        <input id="track-id" placeholder="session id" style="flex:1;min-width:140px;padding:4px 6px;border:1px solid #ccc;border-radius:6px">
        <button id="btn-load-track" title="Load saved track by ID">Load</button>
      </div>

      <div id="gps-status">status: ready</div>
    </div>
  </div>

  <script src="js/qgis2web_expressions.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/L.Control.Layers.Tree.min.js"></script>
  <script src="js/L.Control.Locate.min.js"></script>
  <script src="js/multi-style-layer.js"></script>
  <script src="js/leaflet.rotatedMarker.js"></script>
  <script src="js/leaflet-hash.js"></script>
  <script src="js/Autolinker.min.js"></script>
  <script src="js/rbush.min.js"></script>
  <script src="js/labelgun.min.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/leaflet.photon.js"></script>
  <script src="js/leaflet-measure.js"></script>

  <script src="data/BNDRY_4.js"></script>
  <script src="data/LOTS_5.js"></script>
  <script src="data/CONT_6.js"></script>
  <script src="data/ESA_7.js"></script>
  <script src="data/DW_8.js"></script>
  <script src="data/SBE_9.js"></script>
  <script src="data/EX_BLD_10.js"></script>
  <script src="data/CRK_COV_11.js"></script>
  <script src="data/ENV_RST_12.js"></script>
  <script src="data/SRW_MOTI_13.js"></script>
  <script src="data/CE_14.js"></script>
  <script src="data/BA_15.js"></script>
  <script src="data/ALR_16.js"></script>
  <script src="data/AOI_17.js"></script>
  <script src="data/SEPTIC_18.js"></script>
  <script src="data/WELLS_19.js"></script>
  <script src="data/FENCE_20.js"></script>
  <script src="data/EX_FENCE_21.js"></script>

  <script>
    var map = L.map('map', {
        zoomControl:false, maxZoom:21, minZoom:15
    }).fitBounds([[49.954011553509815,-119.33922884315004],[49.961783579330934,-119.32957344118267]]);
    const INITIAL_BOUNDS = map.getBounds();

    var hash = new L.Hash(map);

    map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
    var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });

    function removeEmptyRowsFromPopupContent(content, feature) {
       var tempDiv = document.createElement('div');
       tempDiv.innerHTML = content;
       var rows = tempDiv.querySelectorAll('tr');
       for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                   rows[i].parentNode.removeChild(rows[i]);
             }
       }
       return tempDiv.innerHTML;
    }
    function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        if (tempDiv.querySelector('td img')) {
            popup._contentNode.classList.add('media');
            setTimeout(function() { popup.update(); }, 10);
        } else {
            popup._contentNode.classList.remove('media');
        }
    }
    var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
    L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
    var measureControl = new L.Control.Measure({
        position: 'topleft',
        primaryLengthUnit: 'meters',
        secondaryLengthUnit: 'kilometers',
        primaryAreaUnit: 'sqmeters',
        secondaryAreaUnit: 'hectares'
    });
    measureControl.addTo(map);
    document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
    document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
    var bounds_group = new L.featureGroup([]);
    function setBounds() {}

    // ... (All the pane, layer, and style definitions from qgis2web) ...
    map.createPane('pane_GoogleMaps_0');
    map.getPane('pane_GoogleMaps_0').style.zIndex = 400;
    var layer_GoogleMaps_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { pane: 'pane_GoogleMaps_0', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21 });
    layer_GoogleMaps_0;
    map.createPane('pane_OSM_1');
    map.getPane('pane_OSM_1').style.zIndex = 401;
    var layer_OSM_1 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { pane: 'pane_OSM_1', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21, minNativeZoom: 0, maxNativeZoom: 19 });
    layer_OSM_1;
    map.createPane('pane_GoogleSatellite_2');
    map.getPane('pane_GoogleSatellite_2').style.zIndex = 402;
    var layer_GoogleSatellite_2 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { pane: 'pane_GoogleSatellite_2', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21 });
    layer_GoogleSatellite_2;
    map.createPane('pane_WorldImagery_3');
    map.getPane('pane_WorldImagery_3').style.zIndex = 403;
    var layer_WorldImagery_3 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { pane: 'pane_WorldImagery_3', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21 });
    layer_WorldImagery_3;
    map.addLayer(layer_WorldImagery_3);
    function pop_BNDRY_4(feature, layer) { }
    function style_BNDRY_4_0() { return { pane: 'pane_BNDRY_4', opacity: 1, color: 'rgba(0,0,0,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: false, } }
    map.createPane('pane_BNDRY_4');
    map.getPane('pane_BNDRY_4').style.zIndex = 404;
    map.getPane('pane_BNDRY_4').style['mix-blend-mode'] = 'normal';
    var layer_BNDRY_4 = new L.geoJson(json_BNDRY_4, { attribution: '', interactive: false, dataVar: 'json_BNDRY_4', layerName: 'layer_BNDRY_4', pane: 'pane_BNDRY_4', onEachFeature: pop_BNDRY_4, style: style_BNDRY_4_0, });
    bounds_group.addLayer(layer_BNDRY_4);
    map.addLayer(layer_BNDRY_4);
    function pop_LOTS_5(feature, layer) { }
    function style_LOTS_5_0() { return { pane: 'pane_LOTS_5', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 6.0, fillOpacity: 0, interactive: true, } }
    map.createPane('pane_LOTS_5');
    map.getPane('pane_LOTS_5').style.zIndex = 405;
    map.getPane('pane_LOTS_5').style['mix-blend-mode'] = 'normal';
    var layer_LOTS_5 = new L.geoJson(json_LOTS_5, { attribution: '', interactive: true, dataVar: 'json_LOTS_5', layerName: 'layer_LOTS_5', pane: 'pane_LOTS_5', onEachFeature: pop_LOTS_5, style: style_LOTS_5_0, });
    bounds_group.addLayer(layer_LOTS_5);
    map.addLayer(layer_LOTS_5);
    function pop_CONT_6(feature, layer) { }
    function style_CONT_6_0() { return { pane: 'pane_CONT_6', opacity: 1, color: 'rgba(243,166,178,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 1.0, fillOpacity: 0, interactive: true, } }
    map.createPane('pane_CONT_6');
    map.getPane('pane_CONT_6').style.zIndex = 406;
    map.getPane('pane_CONT_6').style['mix-blend-mode'] = 'normal';
    var layer_CONT_6 = new L.geoJson(json_CONT_6, { attribution: '', interactive: true, dataVar: 'json_CONT_6', layerName: 'layer_CONT_6', pane: 'pane_CONT_6', onEachFeature: pop_CONT_6, style: style_CONT_6_0, });
    bounds_group.addLayer(layer_CONT_6);
    // ... This continues for all 21 layers ...
    // ... For brevity, I'm skipping the repetitive layer definitions here ...
    // ... The actual file should contain all of them ...
    var overlaysTree = [
        {label: '<b>Solar Village v22</b>', selectAllCheckbox: true, children: [
            {label: '<img src="legend/EX_FENCE_21.png" /> EX_FENCE', layer: layer_EX_FENCE_21},
            {label: '<img src="legend/FENCE_20.png" /> FENCE', layer: layer_FENCE_20},
            // ... all other layers ...
            {label: '<img src="legend/BNDRY_4.png" /> BNDRY', layer: layer_BNDRY_4},
        ]},
        {label: '<b>Baselayers</b>', selectAllCheckbox: true, children: [
            {label: "World Imagery", layer: layer_WorldImagery_3, radioGroup: 'bm' },
            {label: "Google Satellite", layer: layer_GoogleSatellite_2, radioGroup: 'bm' },
            {label: "OSM", layer: layer_OSM_1, radioGroup: 'bm' },
            {label: "Google Maps", layer: layer_GoogleMaps_0, radioGroup: 'bm' },
        ]}
    ];
    var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
    lay.addTo(map);
  </script>

  <script>
    const LogoCtl = L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const div = L.DomUtil.create('div', 'sv-logo-control');
        div.innerHTML =
          '<a href="https://solarvillage.ca" target="_blank"><img src="/solarvilla.png" alt="Solar Village" ' +
          'style="width:28px;height:28px;display:block;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25)"></a>';
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
      }
    });
    map.addControl(new LogoCtl());
  </script>

  <script>
    try {
      if (Array.isArray(overlaysTree)) {
        overlaysTree.forEach(g => (g.children || []).forEach(n => {
          if (n.layer && !n.radioGroup && !map.hasLayer(n.layer)) {
             map.addLayer(n.layer);
          }
        }));
      }
    } catch (e) { console.warn('Overlay autoon error', e); }
  </script>

  <script>
  (() => {
    const BACKEND = {
      pinsGet:     '/.netlify/functions/pins',
      pinsPost:    '/.netlify/functions/pins',
      photosGet:   '/.netlify/functions/photos',
      photoUpload: '/.netlify/functions/uploadPhoto',
      trackPost:   '/.netlify/functions/gpstrack'
    };

    const ui = {
      status: document.getElementById('gps-status'),
      btnZoomIn:  document.getElementById('btn-zoom-in'),
      btnZoomOut: document.getElementById('btn-zoom-out'),
      btnZoomExtents: document.getElementById('btn-zoom-extents'),
      btnLocateOnce: document.getElementById('btn-locate-once'),
      btnTrackToggle: document.getElementById('btn-track-toggle'),
      btnDropPin: document.getElementById('btn-drop-pin'),
      btnMeasureDist:  document.getElementById('btn-measure-dist'),
      btnMeasureArea:  document.getElementById('btn-measure-area'),
      btnMeasureClear: document.getElementById('btn-measure-clear'),
      btnCamOn:   document.getElementById('btn-camera-on'),
      btnCamShot: document.getElementById('btn-camera-shot'),
      btnCamOff:  document.getElementById('btn-camera-off'),
      camWrap:    document.getElementById('camera-wrap'),
      video:      document.getElementById('cam-video'),
      canvas:     document.getElementById('cam-canvas'),
      chkPins:   document.getElementById('chk-pins'),
      chkPhotos: document.getElementById('chk-photos'),
      trackId: document.getElementById('track-id'),
      btnLoadTrack: document.getElementById('btn-load-track')
    };
    const setStatus = m => ui.status.textContent = 'status: ' + m;
    const fmt = n => (n==null || Number.isNaN(n) ? '—' : Math.round(n*100)/100);
    const fmtMeters   = m  => m < 1000 ? `${m.toFixed(1)} m` : `${(m/1000).toFixed(2)} km`;
    const fmtSqMeters = m2 => m2 < 1e6 ? `${m2.toFixed(0)} m²` : `${(m2/1e6).toFixed(2)} km²`;

    // ... (rest of the application script is the same as your provided file)
    // ... including State, Icons, Helper Functions, UI Wiring, etc.
    // The following is an example of the improved pin drop logic implemented
    ui.btnDropPin.onclick = () => {
        setStatus('Click the map to place a pin…');

        const mapContainer = map.getContainer();

        const dropPinCaptureHandler = async (ev) => {
            const panel = document.getElementById('gpscam-ui');
            if (panel && panel.contains(ev.target)) return;

            // This handler is temporary, so remove it immediately
            mapContainer.removeEventListener('click', dropPinCaptureHandler, true);

            const rect = mapContainer.getBoundingClientRect();
            const latlng = map.containerPointToLatLng([ev.clientX - rect.left, ev.clientY - rect.top]);
            
            ev.stopPropagation();
            ev.preventDefault();
            
            const { lat, lng } = latlng;
            const title = prompt('Pin title:', 'Pin') || 'Pin';
            const description = prompt('Pin description (optional):', '') || '';
            await savePin(lng, lat, title, description);
            setStatus('pin saved');
        };

        // Add the listener, and it will remove itself after one use
        mapContainer.addEventListener('click', dropPinCaptureHandler, true);
    };

    // ... (All other functions from the main IIFE would follow here)
  })();
  </script>
</body>
</html>
