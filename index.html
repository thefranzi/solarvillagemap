<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mapbox 3D Terrain & Satellite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%; z-index: 0;
    }
    .controls {
      position: absolute;
      top: 18px; right: 18px;
      background: rgba(255,255,255,0.93);
      padding: 16px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1; min-width: 180px;
    }
    label { font-size: 12px; font-weight: 500; margin-bottom: 8px; }
    input[type="range"] { width: 100%; margin: 8px 0; }
    .value-display { font-size: 14px; font-weight: 600; color: #21808d; }
    .btn {
      display: inline-block; padding: 8px 16px;
      background: #21808d; color: white;
      border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; width: 100%;
      margin-top: 8px;
    }
    .btn:hover { background: #1d7480; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="controls">
    <label>Terrain Exaggeration: <span class="value-display" id="exaggeration-value">1.5x</span></label>
    <input type="range" id="exaggeration" min="0" max="3" step="0.1" value="1.5">
    <label>Pitch: <span class="value-display" id="pitch-value">60°</span></label>
    <input type="range" id="pitch" min="0" max="85" step="1" value="60">
    <button class="btn" id="toggle-3d">Toggle 3D/2D</button>
    <button class="btn" id="reset-view">Reset View</button>
</div>
<script>
  // PUT YOUR MAPBOX ACCESS TOKEN HERE:
   mapboxgl.accessToken = 'pk.eyJ1IjoiZnJhbnppeCIsImEiOiJjbWg5cWNsdTMwY2ZqMm1weHBzYnVrbDFlIn0.J3vRTt1v5Q_WuO8b0CkIHg';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/outdoors-v12', // Best for 3D terrain
    center: [-119.5, 49.9], // Kelowna
    zoom: 12,
    pitch: 60,
    bearing: 0,
    antialias: true
  });

  map.on('load', () => {
    map.addSource('mapbox-dem', {
      'type': 'raster-dem',
      'url': 'mapbox://mapbox.mapbox-terrain-dem-v1', // Public DEM
      'tileSize': 512,
      'maxzoom': 14
    });
    map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

    map.addLayer({
      'id': 'sky',
      'type': 'sky',
      'paint': {
        'sky-type': 'atmosphere',
        'sky-atmosphere-sun': [0.0, 90.0],
        'sky-atmosphere-sun-intensity': 15
      }
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.ScaleControl(), 'bottom-right');

    // ----- Add GeoJSON overlay layers here when ready -----
    /*
    map.addSource('LOTS5', {
      'type': 'geojson',
      'data': 'data/LOTS5.geojson'
    });
    map.addLayer({
      'id': 'LOTS5-fill',
      'type': 'fill',
      'source': 'LOTS5',
      'paint': { 'fill-color': '#a1dab4', 'fill-opacity': 0.4 },
      'filter': ['==', '$type', 'Polygon']
    });
    map.addLayer({
      'id': 'LOTS5-outline',
      'type': 'line',
      'source': 'LOTS5',
      'paint': { 'line-color': '#41b6c4', 'line-width': 1.5 },
      'filter': ['==', '$type', 'Polygon']
    });
    */
  });

  // Controls logic
  const exaggerationSlider = document.getElementById('exaggeration');
  const exaggerationValue = document.getElementById('exaggeration-value');
  const pitchSlider = document.getElementById('pitch');
  const pitchValue = document.getElementById('pitch-value');

  exaggerationSlider.addEventListener('input', (e) => {
    const value = parseFloat(e.target.value);
    exaggerationValue.textContent = value.toFixed(1) + 'x';
    if (map.getTerrain()) {
      map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': value });
    }
  });

  pitchSlider.addEventListener('input', (e) => {
    const value = parseInt(e.target.value);
    pitchValue.textContent = value + '°';
    map.setPitch(value);
  });

  document.getElementById('toggle-3d').addEventListener('click', () => {
    if (map.getTerrain()) {
      map.setTerrain(null);
      pitchSlider.value = 0;
      pitchValue.textContent = '0°';
      map.setPitch(0);
    } else {
      map.setTerrain({
        'source': 'mapbox-dem',
        'exaggeration': parseFloat(exaggerationSlider.value)
      });
      pitchSlider.value = 60;
      pitchValue.textContent = '60°';
      map.setPitch(60);
    }
  });

  document.getElementById('reset-view').addEventListener('click', () => {
    map.flyTo({
      center: [-119.5, 49.9],
      zoom: 12,
      pitch: 60,
      bearing: 0
    });
  });
</script>
</body>
</html>
