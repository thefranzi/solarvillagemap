        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Custom styles for camera and action bar */
        #camera-wrap { display:none; z-index: 10000; position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.95); border-radius: 8px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        #camera-wrap.show { display:block; }
        #cam-video { width: 100%; max-width: 280px; aspect-ratio: 3 / 4; background: #000; object-fit: cover; border-radius: 6px; }
        #cam-canvas { display:none; }
        .sv-actionbar{position:fixed;left:8px;right:8px;bottom:env(safe-area-inset-bottom,8px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(255,255,255,.9);padding:8px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:1000;}
        .sv-act{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:6px 4px;border:none;border-radius:12px;background:#fff;cursor:pointer;}
        .sv-act i{font-size:18px;line-height:1;}
        .sv-act span{font-size:11px;margin-top:4px;}
        @media (max-width:420px){.sv-act span{display:none;}}
        .leaflet-bottom.leaflet-left{margin-bottom:68px;}

        /* STYLES for new Home/Zoom to Extent button */
        .leaflet-control-home a {
            font: bold 18px 'Lucida Console', Monaco, monospace;
            text-align: center;
            line-height: 25px;
        }
        /* Style for the simple measure tool's distance display */
        .sv-measure-chip {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: 85px; z-index: 1600;
            background: #111; color: #fff; padding: 6px 12px;
            border-radius: 12px; font-size: 14px; opacity: .9;
            pointer-events: none;
        }
        </style>
        <title>Solar Village Map</title>

            </div>
