<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solar Village Map</title>

  <!-- Leaflet (swap to your local copies if you prefer) -->
  <link rel="stylesheet" href="css/leaflet.css">
  <script src="js/leaflet.js"></script>

  <style>
    html, body, #map { height: 100%; margin: 0; }

    /* ===== TOOLBOX (top-left) ===== */
    .toolbox {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      width: 300px; max-height: 70vh; overflow-y: auto; overflow-x: hidden;
      background: #fff; border: 1px solid rgba(0,0,0,.2); border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 10px;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .tool-title { font-weight: 600; margin: 0 0 8px; }
    .tool-row {
      display: grid; grid-template-columns: repeat(4, 48px);
      gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .tool-btn {
      width: 48px; height: 48px; border: 1px solid #d0d0d0; background: #fff;
      border-radius: 8px; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .tool-btn:hover { background: #f6f6f6; }
    .tool-btn.active { outline: 2px solid #3aa; }
    .tool-btn svg { width: 22px; height: 22px; fill: currentColor; color: #333; }
    .tool-text { grid-column: 1 / -1; white-space: normal; }

    /* Text input row spans all columns under the buttons */
    .tool-input-row { grid-column: 1 / -1; display: flex; gap: 6px; }
    .tool-input-row input {
      flex: 1; min-width: 0; height: 36px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .tool-input-row button {
      height: 36px; padding: 0 10px; border: 1px solid #d0d0d0; background: #fff; border-radius: 6px; cursor: pointer;
    }
    .tool-input-row button:hover { background: #f6f6f6; }

    /* ===== FULLSCREEN PHOTO MODAL ===== */
    .photo-modal.hidden { display: none; }
    .photo-modal { position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; }
    .photo-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.7); }
    #photo-modal-img { position: relative; max-width: 95vw; max-height: 90vh;
      box-shadow: 0 10px 30px rgba(0,0,0,.6); border-radius: 8px; }
    #photo-modal-close { position: absolute; top: 16px; right: 20px;
      background: rgba(0,0,0,.6); color: #fff; border: 0; width: 40px; height: 40px;
      border-radius: 20px; font-size: 24px; cursor: pointer; }
    #photo-modal-close:hover { background: rgba(0,0,0,.8); }
    .popup-photo { cursor: zoom-in; max-width: 240px; max-height: 240px; border-radius: 6px; }

    /* ===== LOGO CONTROL (top-right, under layers) ===== */
    .sv-logo-control {
      background: #fff; border: 1px solid rgba(0,0,0,.2); border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3); width: 36px; height: 36px;
      display: grid; place-items: center; margin-top: 4px;
    }
    .sv-logo-control img { width: 34px; height: 34px; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- ===== TOOLBOX ===== -->
  <div id="toolbox" class="toolbox">
    <h3 class="tool-title">Tools</h3>

    <!-- Camera controls -->
    <div class="tool-row">
      <button id="btn-photo-open" class="tool-btn" title="Take Photo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm8 3.5A4.5 4.5 0 1 0 16.5 15 4.5 4.5 0 0 0 12 10.5z"/>
        </svg>
      </button>
      <button id="btn-photo-close" class="tool-btn" title="Close Camera">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 22A10 10 0 1 1 22 12 10 10 0 0 1 12 22zm-1.4-6.6L12 14l1.4 1.4 1.6-1.6L13.6 12l1.4-1.4-1.6-1.6L12 10l-1.4-1.4-1.6 1.6L10.4 12l-1.4 1.4z"/>
        </svg>
      </button>

      <!-- GPS controls -->
      <button id="btn-track-start" class="tool-btn" title="Start GPS">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 2v2a7 7 0 0 1 7 7h2a9 9 0 0 0-9-9zM4 11H2a9 9 0 0 0 9 9v-2a7 7 0 0 1-7-7z"/>
        </svg>
      </button>
      <button id="btn-track-stop" class="tool-btn" title="Stop GPS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>

      <!-- Load past track (session id) -->
      <div class="tool-input-row">
        <input id="track-id" placeholder="Enter sessionId to load (e.g., sess_abcd…)" />
        <button id="btn-track-load" title="Load Track">Load</button>
      </div>
    </div>

    <div class="tool-row">
      <div class="tool-text" id="tool-msg">Ready.</div>
    </div>
  </div>

  <!-- ===== FULLSCREEN PHOTO MODAL ===== -->
  <div id="photo-modal" class="photo-modal hidden">
    <div class="photo-modal-backdrop"></div>
    <img id="photo-modal-img" alt="Photo" />
    <button id="photo-modal-close" aria-label="Close">×</button>
  </div>

  <script>
    // ===== Map init =====
    const map = L.map('map').setView([49.88, -119.49], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // ===== Logo control (uses /sollarvilla.png in site root) =====
    const LogoControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const c = L.DomUtil.create('div', 'leaflet-control sv-logo-control');
        const img = L.DomUtil.create('img', '', c);
        img.src = '/sollarvilla.png';
        img.alt = 'Solar Village';
        L.DomEvent.disableClickPropagation(c);
        return c;
      }
    });
    map.addControl(new LogoControl());

    // ===== Photo popup helper =====
    function renderPhotoPopup(feature) {
      const p = feature.properties || {};
      const title = p.title || '';
      const desc  = p.description || '';
      const imageUrl = p.imageUrl || '';
      return `
        <div class="popup">
          <div class="title">${title}</div>
          <img class="popup-photo" src="${imageUrl}" data-fullsrc="${imageUrl}" alt="${title || 'Photo'}">
          <div class="desc">${desc}</div>
          <div style="margin-top:6px;">
            <a href="${imageUrl}" target="_blank" rel="noopener">Open in new tab</a>
          </div>
        </div>`;
    }

    // Load photo features and place markers
    fetch('/.netlify/functions/photos')
      .then(r => r.json())
      .then(fc => {
        (fc.features || []).forEach(f => {
          if (f.geometry && f.geometry.type === 'Point') {
            const [lng, lat] = f.geometry.coordinates;
            const m = L.marker([lat, lng]).addTo(map);
            m.bindPopup(renderPhotoPopup(f));
          }
        });
      })
      .catch(() => {});

    // ===== Lightbox wiring =====
    (() => {
      const modal = document.getElementById('photo-modal');
      const modalImg = document.getElementById('photo-modal-img');
      const modalClose = document.getElementById('photo-modal-close');
      const modalBackdrop = modal.querySelector('.photo-modal-backdrop');

      function openModal(src){ modalImg.src = src; modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
      function closeModal(){ modalImg.src = ''; modal.classList.add('hidden'); document.body.style.overflow = ''; }

      document.addEventListener('click', (e) => {
        const img = e.target.closest('img.popup-photo');
        if (img && img.dataset.fullsrc) { e.preventDefault(); e.stopPropagation(); openModal(img.dataset.fullsrc); }
      }, { capture: true });

      modalBackdrop.addEventListener('click', closeModal);
      modalClose.addEventListener('click', closeModal);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    })();

    // ===== GPS tracking (front-end) =====
    (() => {
      let watchId = null;
      let sessionId = null;
      let buffer = [];
      let flushTimer = null;
      let trackLine = null;

      const FLUSH_MS = 5000;
      const MAX_BATCH = 50;

      const btnStart = document.getElementById('btn-track-start');
      const btnStop  = document.getElementById('btn-track-stop');
      const btnLoad  = document.getElementById('btn-track-load');
      const inputId  = document.getElementById('track-id');
      const msg = document.getElementById('tool-msg');

      function log(s){ if (msg) msg.textContent = s; }

      function flushNow() {
        if (!buffer.length || !sessionId) return;
        const batch = buffer.splice(0, MAX_BATCH);
        fetch('/.netlify/functions/gpstrack', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId, points: batch })
        }).catch(()=>{});
      }

      function startFlushTimer(){ if (!flushTimer) flushTimer = setInterval(flushNow, FLUSH_MS); }
      function stopFlushTimer(){ if (flushTimer) clearInterval(flushTimer); flushTimer = null; }

      function startTracking() {
        if (!navigator.geolocation) { log('GPS not available'); return; }
        if (watchId) return;
        sessionId = sessionId || `sess_${Date.now().toString(36)}`;
        buffer = [];
        if (!trackLine) trackLine = L.polyline([], { color: '#1f7', weight: 4, opacity: .85 }).addTo(map);

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude:lat, longitude:lng, accuracy:acc } = pos.coords;
            const ts = pos.timestamp || Date.now();
            buffer.push({ lat, lng, ts, acc });
            trackLine.addLatLng([lat, lng]);
            if (buffer.length >= MAX_BATCH) flushNow();
            log(`Tracking: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(acc||0)}m)`);
          },
          err => { log(`GPS error: ${err.code}`); },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
        );
        startFlushTimer();
        btnStart?.classList.add('active'); btnStop?.classList.remove('active');
      }

      function stopTracking() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        flushNow(); stopFlushTimer();
        btnStart?.classList.remove('active'); btnStop?.classList.add('active');
        log('Tracking stopped.');
      }

      // Load a past track from GitHub raw and draw it
      function loadTrackById(id) {
        const safe = encodeURIComponent(id);
        // Hard-code owner/repo/branch since repo is public:
        const url = `https://raw.githubusercontent.com/thefranzi/solarvillagemap/main/data/tracks/${safe}.geojson`;
        fetch(url, { cache: 'no-store' })
          .then(r => {
            if (!r.ok) throw new Error('Track not found');
            return r.json();
          })
          .then(fc => {
            const pts = (fc.features || []).filter(f => f.geometry?.type === 'Point');
            if (!pts.length) throw new Error('No points in track');
            // Sort by timestamp if present
            pts.sort((a,b) => (a.properties?.ts||0) - (b.properties?.ts||0));
            const latlngs = pts.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
            const poly = L.polyline(latlngs, { color: '#17f', weight: 4, opacity: .9 }).addTo(map);
            map.fitBounds(poly.getBounds(), { padding: [20,20] });
            log(`Loaded ${latlngs.length} points from ${id}`);
          })
          .catch(err => { log(`Load failed: ${err.message}`); });
      }

      btnStart?.addEventListener('click', startTracking);
      btnStop?.addEventListener('click', stopTracking);
      btnLoad?.addEventListener('click', () => {
        const id = (inputId?.value || '').trim();
        if (!id) { log('Enter a sessionId'); return; }
        loadTrackById(id);
      });
    })();

    // ===== Hook camera buttons to your existing functions if present =====
    document.getElementById('btn-photo-open')?.addEventListener('click', () => {
      if (typeof window.openCamera === 'function') window.openCamera();
    });
    document.getElementById('btn-photo-close')?.addEventListener('click', () => {
      if (typeof window.closeCamera === 'function') window.closeCamera();
    });
  </script>
</body>
</html>
