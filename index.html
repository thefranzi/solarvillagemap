<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Terrain Map - Mapbox GL JS</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        :root {
            --color-background: rgba(252, 252, 249, 1);
            --color-surface: rgba(255, 255, 253, 1);
            --color-text: rgba(19, 52, 59, 1);
            --color-primary: rgba(33, 128, 141, 1);
            --color-primary-hover: rgba(29, 116, 128, 1);
            --color-border: rgba(94, 82, 64, 0.2);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font-family-base);
            background: var(--color-background);
            color: var(--color-text);
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--color-surface);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1;
            min-width: 200px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover {
            background: var(--color-primary-hover);
        }

        .value-display {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--color-surface);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 12px;
            max-width: 300px;
        }
        /* Toggle 2D/3D switch styles */
        .toggle2d3d {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
        }
        .toggle2d3d-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-size: 15px;
            cursor: pointer;
        }
        .toggle2d3d-btn:hover {
            background: var(--color-primary-hover);
        }
    </style>
</head>
<body>
<div class="toggle2d3d">
  <!-- Update this link after upload to Netlify/github for your legacy 2D map file -->
  <a href="index-leaflet.html" class="toggle2d3d-btn">Switch to 2D Map</a>
</div>

<div id="map"></div>
<div class="controls">
    <div class="control-group">
        <label>Terrain Exaggeration: <span class="value-display" id="exaggeration-value">1.5x</span></label>
        <input type="range" id="exaggeration" min="0" max="3" step="0.1" value="1.5">
    </div>
    <div class="control-group">
        <label>Pitch: <span class="value-display" id="pitch-value">60°</span></label>
        <input type="range" id="pitch" min="0" max="85" step="1" value="60">
    </div>
    <div class="control-group">
        <button class="btn" id="toggle-3d">Toggle 3D/2D</button>
        <button class="btn" id="reset-view">Reset View</button>
    </div>
</div>
<div class="info">
    <h3>Instructions:</h3>
    <p><strong>Change DEM:</strong> Update the 'custom-dem' source URL with your own.</p>
    <p><strong>Add Layers:</strong> Import your qgis2web GeoJSON layers (see code comments).</p>
    <p><strong>Switch Views:</strong> Use the “2D Map” button to view the original layout.</p>
    <p><strong>Deploy:</strong> Push to GitHub → Deploy via Netlify.</p>
</div>
<script>
    // Replace 'YOUR_MAPBOX_ACCESS_TOKEN' with your actual token
    mapboxgl.accessToken = pk.eyJ1IjoiZnJhbnppeCIsImEiOiJjbWg5cWNsdTMwY2ZqMm1weHBzYnVrbDFlIn0.J3vRTt1v5Q_WuO8b0CkIHg

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        center: [-119.5, 49.9],
        zoom: 11,
        pitch: 60,
        bearing: 0,
        antialias: true
    });

    map.on('load', () => {
        // Terrain source (default global)
        map.addSource('mapbox-dem', {
            'type': 'raster-dem',
            'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
            'tileSize': 512,
            'maxzoom': 14
        });
        // To use your custom DEM instead, upload to Mapbox Studio and swap the below:
        /*
        map.addSource('custom-dem', {
          'type': 'raster-dem',
          'url': 'mapbox://YOUR_USERNAME/YOUR_DEM_TILESET_ID',
          'tileSize': 512,
          'maxzoom': 14
        });
        map.setTerrain({
          'source': 'custom-dem',
          'exaggeration': 1.5
        });
        */
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

        map.addLayer({
            'id': 'sky',
            'type': 'sky',
            'paint': {
                'sky-type': 'atmosphere',
                'sky-atmosphere-sun': [0.0, 90.0],
                'sky-atmosphere-sun-intensity': 15
            }
        });

        // Example: Add a GeoJSON layer from qgis2web export (uncomment when ready)
        /*
        map.addSource('your-layer', {
            'type': 'geojson',
            'data': 'data/your-layer.geojson'
        });
        map.addLayer({
            'id': 'your-layer-fill',
            'type': 'fill',
            'source': 'your-layer',
            'paint': {
                'fill-color': '#088',
                'fill-opacity': 0.5
            }
        });
        map.addLayer({
            'id': 'your-layer-outline',
            'type': 'line',
            'source': 'your-layer',
            'paint': {
                'line-color': '#000',
                'line-width': 2
            }
        });
        */

        map.addControl(new mapboxgl.NavigationControl(), 'top-left');
        map.addControl(new mapboxgl.ScaleControl(), 'bottom-right');
    });

    // Control handlers
    const exaggerationSlider = document.getElementById('exaggeration');
    const exaggerationValue = document.getElementById('exaggeration-value');
    const pitchSlider = document.getElementById('pitch');
    const pitchValue = document.getElementById('pitch-value');

    exaggerationSlider.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        exaggerationValue.textContent = value.toFixed(1) + 'x';
        if (map.getTerrain()) {
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': value });
        }
    });

    pitchSlider.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        pitchValue.textContent = value + '°';
        map.setPitch(value);
    });

    document.getElementById('toggle-3d').addEventListener('click', () => {
        if (map.getTerrain()) {
            map.setTerrain(null);
            pitchSlider.value = 0;
            pitchValue.textContent = '0°';
            map.setPitch(0);
        } else {
            map.setTerrain({
                'source': 'mapbox-dem',
                'exaggeration': parseFloat(exaggerationSlider.value)
            });
            pitchSlider.value = 60;
            pitchValue.textContent = '60°';
            map.setPitch(60);
        }
    });

    document.getElementById('reset-view').addEventListener('click', () => {
        map.flyTo({
            center: [-119.5, 49.9],
            zoom: 11,
            pitch: 60,
            bearing: 0
        });
    });
</script>
</body>
</html>
