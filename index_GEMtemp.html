<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #camera-wrap { display:none; z-index: 10000; position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.95); border-radius: 8px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        #camera-wrap.show { display:block; }
        #cam-video { width: 100%; max-width: 280px; aspect-ratio: 3 / 4; background: #000; object-fit: cover; border-radius: 6px; }
        #cam-canvas { display:none; }
        #gps-status { position: absolute; top: 12px; right: 50px; z-index: 999; background: rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 4px; font-family: sans-serif; font-size: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.2); pointer-events: none; }
        </style>
        <title></title>
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <script src="https://unpkg.com/exifr/dist/full.umd.js"></script>
        <style>
        .sv-actionbar{position:fixed;left:8px;right:8px;bottom:env(safe-area-inset-bottom,8px);display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:rgba(255,255,255,.9);padding:8px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:1000;}
        .sv-act{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:6px 4px;border:none;border-radius:12px;background:#fff;cursor:pointer;}
        .sv-act i{font-size:18px;line-height:1;}
        .sv-act span{font-size:11px;margin-top:4px;}
        @media (max-width:420px){.sv-act span{display:none;}}
        .leaflet-bottom.leaflet-left{margin-bottom:68px;}
        </style>
    </head>
    <body>
        <div id="map">
            <div id="camera-wrap">
                <video id="cam-video" autoplay playsinline muted></video>
                <canvas id="cam-canvas"></canvas>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
                    <button id="btn-camera-shot" title="Take photo" style="padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;">Take Photo</button>
                    <button id="btn-camera-off"  title="Stop camera" style="padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;">Close</button>
                </div>
            </div>
             <div id="gps-status">status: ready</div>
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/BNDRY_4.js"></script>
        <script src="data/LOTS_5.js"></script>
        <script src="data/ESA_7.js"></script>
        <script src="data/DW_8.js"></script>
        <script src="data/SBE_9.js"></script>
        <script src="data/EX_BLD_10.js"></script>
        <script src="data/CRK_COV_11.js"></script>
        <script src="data/ENV_RST_12.js"></script>
        <script src="data/SRW_MOTI_13.js"></script>
        <script src="data/CE_14.js"></script>
        <script src="data/BA_15.js"></script>
        <script src="data/ALR_16.js"></script>
        <script src="data/AOI_17.js"></script>
        <script src="data/SEPTIC_18.js"></script>
        <script src="data/WELLS_19.js"></script>
        <script src="data/FENCE_20.js"></script>
        <script src="data/EX_FENCE_21.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            var map = L.map('map', {
                zoomControl: false,
                maxZoom: 21,
                minZoom: 15
            });
            
            var hash = new L.Hash(map);
            map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
            var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

            var measureControl = new L.Control.Measure({
                position: 'topleft',
                primaryLengthUnit: 'meters',
                secondaryLengthUnit: 'kilometers',
                primaryAreaUnit: 'sqmeters',
                secondaryAreaUnit: 'hectares'
            });
            measureControl.addTo(map);

            var bounds_group = new L.featureGroup([]);

            map.createPane('pane_GoogleMaps_0');
            map.getPane('pane_GoogleMaps_0').style.zIndex = 400;
            var layer_GoogleMaps_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { pane: 'pane_GoogleMaps_0', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21 });
            
            map.createPane('pane_WorldImagery_3');
            map.getPane('pane_WorldImagery_3').style.zIndex = 403;
            var layer_WorldImagery_3 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { pane: 'pane_WorldImagery_3', opacity: 1.0, attribution: '', minZoom: 15, maxZoom: 21 });
            map.addLayer(layer_WorldImagery_3);

            function style_BNDRY_4_0() { return { pane: 'pane_BNDRY_4', opacity: 1, color: 'rgba(0,0,0,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: false } }
            map.createPane('pane_BNDRY_4'); map.getPane('pane_BNDRY_4').style.zIndex = 404; var layer_BNDRY_4 = new L.geoJson(json_BNDRY_4,{attribution:'',interactive:false,dataVar:'json_BNDRY_4',layerName:'layer_BNDRY_4',pane:'pane_BNDRY_4',style:style_BNDRY_4_0});
            bounds_group.addLayer(layer_BNDRY_4);
            map.addLayer(layer_BNDRY_4);
            
            map.fitBounds(layer_BNDRY_4.getBounds());
            
            var pinsLayer = L.featureGroup().addTo(map);
            var photosLayer = L.featureGroup().addTo(map);
            
            var overlaysTree = [
                {label: '<b>User Content</b>', selectAllCheckbox: true, children: [
                    {label: '<i class="fas fa-map-pin" style="color:#ff8c00; margin-right: 5px;"></i> User Pins', layer: pinsLayer},
                    {label: '<i class="fas fa-camera" style="color:#7e57c2; margin-right: 5px;"></i> User Photos', layer: photosLayer}
                ]},
                {label: '<b>Project Layers</b>', selectAllCheckbox: true, children: [
                    // Future project layers can be added here
                ]},
                {label: '<b>Baselayers</b>', selectAllCheckbox: true, children: [
                    {label: "World Imagery", layer: layer_WorldImagery_3, radioGroup: 'bm' },
                    {label: "Google Maps", layer: layer_GoogleMaps_0, radioGroup: 'bm' },
                ]},
            ];

            var lay = L.control.layers.tree(null, overlaysTree,{ collapsed: true });
            lay.addTo(map);

            L.Control.Logo = L.Control.extend({
                onAdd: function(map) {
                    var container = L.DomUtil.create('div', 'leaflet-control-logo leaflet-control');
                    container.innerHTML = '<a href="https://www.solarvillage.ca" target="_blank" rel="noopener noreferrer"><img src="solarvilla.png" alt="Solar Village Logo"></a>';
                    L.DomEvent.disableClickPropagation(container);
                    return container;
                }
            });
            new L.Control.Logo({ position: 'topleft' }).addTo(map);

            const BACKEND = { pinsGet:'/.netlify/functions/pins', pinsPost:'/.netlify/functions/pins', photosGet:'/.netlify/functions/photos', photoUpload:'/.netlify/functions/uploadPhoto' };
            const state = { lastFix: null, dropPinArmed: false, cam: { stream:null }, gpsMarker: null };
            const ui = {
                status: document.getElementById('gps-status'),
                btnLocate: document.getElementById('btn-locate'),
                btnAddPin: document.getElementById('btn-add-pin'),
                btnCamera: document.getElementById('btn-camera'),
                btnMeasure: document.getElementById('btn-measure'),
                btnLayers: document.getElementById('btn-layers'),
                btnCamShot: document.getElementById('btn-camera-shot'),
                btnCamOff: document.getElementById('btn-camera-off'),
                camWrap: document.getElementById('camera-wrap'),
                video: document.getElementById('cam-video'),
                canvas: document.getElementById('cam-canvas'),
                measureMenu: document.getElementById('measure-menu'),
                measureDist: document.getElementById('btn-measure-dist'),
                measureArea: document.getElementById('btn-measure-area'),
                measureClear: document.getElementById('btn-measure-clear'),
            };

            const setStatus = m => ui.status.textContent = 'status: ' + m;
            const pinIcon = L.icon({ iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M20 2c-6.1 0-11 4.9-11 11 0 8.3 11 23 11 23s11-14.7 11-23c0-6.1-4.9-11-11-11z" fill="#ff8c00"/><circle cx="20" cy="13" r="5.5" fill="#fff"/></svg>`), iconSize: [40, 40], iconAnchor: [20, 38], popupAnchor: [0, -32] });
            const photoIcon = L.icon({ iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M6 12a4 4 0 0 1 4-4h5l2-2h6l2 2h5a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V12z" fill="#7e57c2"/><circle cx="20" cy="22" r="6.5" fill="#fff"/><circle cx="20" cy="22" r="3.5" fill="#7e57c2"/></svg>`), iconSize: [40, 40], iconAnchor: [20, 36], popupAnchor: [0, -30] });
            const gpsIcon = L.divIcon({ className: 'leaflet-control-locate-marker', html: '<div class="leaflet-control-locate-heading"></div><div class="leaflet-control-locate-pulse"></div>', iconSize: [34, 34], iconAnchor: [17, 17] });
            
            function onFix(p, recenter=false) { const c = p.coords; state.lastFix = { time:p.timestamp, lat:c.latitude, lng:c.longitude }; const latlng = [state.lastFix.lat, state.lastFix.lng]; if (recenter) map.setView(latlng, Math.max(map.getZoom(), 18)); if (!state.gpsMarker) { state.gpsMarker = L.marker(latlng, { icon: gpsIcon }).addTo(map); } else { state.gpsMarker.setLatLng(latlng); } setStatus(`fix @ ${new Date(state.lastFix.time).toLocaleTimeString()}`); }
            function onGeoError(err) { setStatus('error: ' + err.message); alert('Location error: ' + err.message); }
            async function loadData(url, addFeatureFunc) { try { (await(await fetch(`${url}?t=${Date.now()}`,{cache:'no-store'})).json()).features.forEach(addFeatureFunc); } catch(e) { console.error('Data load error', e); } }
            function addPinFeature(feat) { if (!feat?.geometry?.coordinates) return; const [lng, lat] = feat.geometry.coordinates; L.marker([lat, lng],{icon:pinIcon}).addTo(pinsLayer).bindPopup(`<b>${feat.properties.title||'Pin'}</b><br>${feat.properties.description||''}`); }
            async function savePin(lng, lat, title, description) { const f = {type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{title,description,ts:Date.now()}}; const r = await fetch(BACKEND.pinsPost,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)}); if(!r.ok) throw new Error('Failed to save pin.'); addPinFeature(await r.json()); }
			function addPhotoFeature(feat) { if (!feat?.geometry?.coordinates) return; const [lng, lat] = feat.geometry.coordinates; const h=`<div style="max-width:220px"><b>${feat.properties.title||'Photo'}</b>${feat.properties.description?`<br>${feat.properties.description}`:''}${feat.properties.imageUrl?`<div style="margin-top:6px"><img src="${feat.properties.imageUrl}" alt style="width:100px;max-height:80px;border-radius:4px;object-fit:cover;cursor:pointer" onclick="openPhotoModal('${feat.properties.imageUrl}')"></div>`:''}</div>`; L.marker([lat,lng],{icon:photoIcon}).addTo(photosLayer).bindPopup(h); }
            async function camOn() { try { const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); state.cam.stream=s; ui.video.srcObject=s; await ui.video.play(); ui.camWrap.classList.add('show'); setStatus('camera on'); } catch(e){ alert('Camera error: '+e.message); setStatus('camera error'); } }

            let dropPinCaptureHandler = null;
            function disarmPinDrop() { if(state.dropPinArmed) { state.dropPinArmed = false; setStatus('Pin drop cancelled.'); if (dropPinCaptureHandler) { map.getContainer().removeEventListener('click', dropPinCaptureHandler, true); dropPinCaptureHandler = null; } } }
            
            ui.btnLocate.onclick = () => { disarmPinDrop(); if (!navigator.geolocation) return alert('Geolocation not supported.'); setStatus('locating...'); navigator.geolocation.getCurrentPosition(p => onFix(p, true), onGeoError, { enableHighAccuracy:true, timeout:10000, maximumAge:0 }); };
            ui.btnAddPin.onclick = () => { if (state.dropPinArmed) return disarmPinDrop(); state.dropPinArmed = true; setStatus('Click the map to place a pin…'); map.getContainer().addEventListener('click', dropPinCaptureHandler = async (ev) => { if (!state.dropPinArmed) return; const els = [document.getElementById('actionbar'), document.querySelector('.leaflet-control-container'), document.getElementById('measure-menu')]; if (els.some(el => el && el.contains(ev.target))) return; ev.stopPropagation(); ev.preventDefault(); const latlng = map.containerPointToLatLng([ev.clientX, ev.clientY]); disarmPinDrop(); const title = prompt('Pin title:', 'Pin') || 'Pin'; const description = prompt('Pin description (optional):', '') || ''; try { setStatus('saving pin...'); await savePin(latlng.lng, latlng.lat, title, description); setStatus('pin saved'); } catch (e) { console.error("Failed to save pin:", e); setStatus('pin save failed'); alert("Error: Could not save pin."); } }, {capture: true, once: true}); };
            ui.btnCamera.onclick = () => { disarmPinDrop(); camOn(); };
            ui.btnLayers.onclick = () => { disarmPinDrop(); document.querySelector('.leaflet-control-layers').classList.toggle('leaflet-control-layers-expanded'); };
            ui.btnCamOff.onclick = () => { if (state.cam.stream) state.cam.stream.getTracks().forEach(t => t.stop()); state.cam.stream = null; ui.video.srcObject = null; ui.camWrap.classList.remove('show'); setStatus('camera off'); };
            ui.btnCamShot.onclick = async () => { if (!state.cam.stream) return; const [w,h]=[ui.video.videoWidth,ui.video.videoHeight]; if (!w||!h) return; ui.canvas.width=w;ui.canvas.height=h; ui.canvas.getContext('2d').drawImage(ui.video,0,0,w,h); const blob = await new Promise(res=>ui.canvas.toBlob(res,'image/jpeg',0.8)); const fix=state.lastFix; const {lat,lng}=fix?fix:map.getCenter(); const title=prompt('Photo title (optional):','')||'Photo'; const description=prompt('Photo description (optional):','')||''; const filename=`photo_${Date.now()}.jpg`; setStatus('saving photo...'); try { await uploadPhoto(blob,filename,lat,lng,title,description); setStatus('photo saved'); } catch(e) { console.error("Failed to upload photo:",e); setStatus('photo save failed'); alert("Error: Could not upload photo."); } finally { ui.btnCamOff.onclick(); } };

            ui.btnMeasure.onclick = (e) => { e.stopPropagation(); disarmPinDrop(); ui.measureMenu.classList.toggle('show'); };
            document.addEventListener('click', (e) => { if (!ui.measureMenu.contains(e.target) && !ui.btnMeasure.contains(e.target)) ui.measureMenu.classList.remove('show'); });
            
            const triggerMeasureAction = (action) => {
                const button = document.querySelector(`.leaflet-control-measure-${action} a`);
                if (button) {
                    button.click();
                } else if (action === 'clear' && measureControl._layer) { 
                    measureControl.clearAllMeasurements();
                }
                ui.measureMenu.classList.remove('show');
            }
            ui.measureDist.onclick = () => triggerMeasureAction('distance');
            ui.measureArea.onclick = () => triggerMeasureAction('area');
            ui.measureClear.onclick = () => triggerMeasureAction('clear');

            loadData(BACKEND.pinsGet, addPinFeature);
            loadData(BACKEND.photosGet, addPhotoFeature).then(() => setStatus('ready'));
            try { if(!localStorage.getItem('sv_toast_seen')){ const el=document.getElementById('sv-toast'); if(el){ el.style.display='block'; setTimeout(() => { el.style.display='none'; localStorage.setItem('sv_toast_seen','1'); }, 4200); } } } catch(e){}
        });
		</script>
        <div id="photo-modal" style="display:none; position:fixed; z-index:20000; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); justify-content:center; align-items:center;">
            <span style="position:absolute; top:20px; right:40px; font-size:40px; color:#fff; cursor:pointer;" onclick="closePhotoModal()">&#10005;</span>
            <img id="photo-modal-img" src="" style="max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 2px 20px #000;">
        </div>
        <script>
            function openPhotoModal(src) { document.getElementById('photo-modal-img').src=src; document.getElementById('photo-modal').style.display='flex'; }
            function closePhotoModal() { document.getElementById('photo-modal').style.display='none'; document.getElementById('photo-modal-img').src=''; }
            document.addEventListener('DOMContentLoaded', function() {
                const photoModal = document.getElementById('photo-modal');
                if(photoModal) { photoModal.onclick = (e) => { if(e.target === e.currentTarget) closePhotoModal(); }; }
            });
        </script>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            function loadScriptOnce(url) { return new Promise(function(resolve, reject) { if (document.querySelector(`script[src="${url}"]`)) return resolve(); var s=document.createElement('script'); s.src=url; s.async=true; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); }); }
            async function ensureContoursLoaded() { if(!window.layer_CONT_6||layer_CONT_6.__loaded) return; try { await loadScriptOnce('data/CONT_6.js'); if(typeof json_CONT_6 === 'undefined') return; var nl=new L.geoJson(json_CONT_6,{attribution:'',interactive:true,dataVar:'json_CONT_6',layerName:'layer_CONT_6',pane:'pane_CONT_6',onEachFeature:pop_CONT_6,style:style_CONT_6_0}); nl.eachLayer(ly=>layer_CONT_6.addLayer(ly)); layer_CONT_6.__loaded=true; } catch(e) { console.error('[contours] load error', e); } }
            map.on('overlayadd', e => { if (e.layer === layer_CONT_6) ensureContoursLoaded(); });
        });
        </script>
        <div id="actionbar" class="sv-actionbar">
            <button id="btn-locate" class="sv-act"><i class="fas fa-crosshairs"></i><span>Locate</span></button>
            <button id="btn-add-pin" class="sv-act"><i class="fas fa-map-pin"></i><span>Add Pin</span></button>
            <button id="btn-camera" class="sv-act"><i class="fas fa-camera"></i><span>Photo</span></button>
            <button id="btn-measure" class="sv-act"><i class="fas fa-ruler-combined"></i><span>Measure</span></button>
            <button id="btn-layers" class="sv-act"><i class="fas fa-layer-group" style="color: #444444;"></i><span>Layers</span></button>
        </div>
        <div id="measure-menu">
            <button id="btn-measure-dist"><i class="fas fa-ruler-horizontal"></i> Distance</button>
            <button id="btn-measure-area"><i class="fas fa-vector-square"></i> Area</button>
            <button id="btn-measure-clear"><i class="fas fa-trash"></i> Clear</button>
        </div>
        <div id="sv-toast" style="position:fixed;left:12px;right:12px;bottom:90px;z-index:1200;display:none">
            <div style="background:#111;color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px">
                Tip: tap <i class="fas fa-crosshairs"></i> to center on your location, and <i class="fas fa-layer-group"></i> to manage layers.
            </div>
        </div>
    </body>
</html>
