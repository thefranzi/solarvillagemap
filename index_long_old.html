        function removeEmptyRowsFromPopupContent(content, feature) {
           var tempDiv = document.createElement('div');
           tempDiv.innerHTML = content;
           var rows = tempDiv.querySelectorAll('tr');
           for (var i = 0; i < rows.length; i++) {
                 var td = rows[i].querySelector('td.visible-with-data');
                 var key = td ? td.id : '';
                 if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                       rows[i].parentNode.removeChild(rows[i]);
                 }
           }
           return tempDiv.innerHTML;
        }
        
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}

		<script>
        // Main Application Logic - WRAPPED TO PREVENT TIMING ISSUES
        document.addEventListener('DOMContentLoaded', function() {
            // ======= BACKEND CONFIG =======
            const BACKEND = {
                pinsGet:    '/.netlify/functions/pins',
                pinsPost:   '/.netlify/functions/pins',
                photosGet:  '/.netlify/functions/photos',
                photoUpload:'/.netlify/functions/uploadPhoto'
            };

            // ======= STATE & HELPERS =======
            const state = {
                watchId: null,
                lastFix: null,
                track: [],
                gps: { marker:null, accuracy:null, bearingLine:null },
                pinsLayer: pinsLayer,       // Reference global var
                photosLayer: photosLayer,   // Reference global var
                dropPinArmed: false,
                cam: { stream:null }
            };

            const ui = {
                status: document.getElementById('gps-status'),
                // Bottom Action Bar Buttons
                btnLocate:   document.getElementById('btn-locate'),
                btnAddPin:   document.getElementById('btn-add-pin'),
                btnCamera:   document.getElementById('btn-camera'),
                // Camera UI elements
                btnCamShot: document.getElementById('btn-camera-shot'),
                btnCamOff:  document.getElementById('btn-camera-off'),
                camWrap:    document.getElementById('camera-wrap'),
                video:      document.getElementById('cam-video'),
                canvas:     document.getElementById('cam-canvas'),
            };

            const fmt = n => (n==null ? '—' : Math.round(n*10)/10);
            const setStatus = m => ui.status.textContent = 'status: ' + m;
            
            function normLngLat(coords) {
                let [x, y] = coords.map(Number);
                const looksLat = Math.abs(x) <= 90 && Math.abs(y) > 90;
                const impossible = Math.abs(x) > 180 || Math.abs(y) > 90;
                if (looksLat || impossible) [x, y] = [y, x];
                return [x, y];
            }

            // Hide original leaflet zoom/locate controls to avoid duplicates
            if (map.zoomControl) map.removeControl(map.zoomControl);
            document.querySelectorAll('.leaflet-control-locate').forEach(el => el.style.display = 'none');

            // ======= GPS & ICONS =======
            const gpsIcon = L.icon({
                iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="10" fill="#1e90ff" /><circle cx="20" cy="20" r="4" fill="white"/></svg>`),
                iconSize: [40,40], iconAnchor: [20,20]
            });
            const pinIcon = L.icon({
                iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M20 2c-6.1 0-11 4.9-11 11 0 8.3 11 23 11 23s11-14.7 11-23c0-6.1-4.9-11-11-11z" fill="#ff8c00"/><circle cx="20" cy="13" r="5.5" fill="#fff"/></svg>`),
                iconSize: [40, 40], iconAnchor: [20, 38], popupAnchor: [0, -32]
            });
            const photoIcon = L.icon({
                iconUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M6 12a4 4 0 0 1 4-4h5l2-2h6l2 2h5a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V12z" fill="#7e57c2"/><circle cx="20" cy="22" r="6.5" fill="#fff"/><circle cx="20" cy="22" r="3.5" fill="#7e57c2"/></svg>`),
                iconSize: [40, 40], iconAnchor: [20, 36], popupAnchor: [0, -30]
            });
            
            function onFix(p, recenter=false) {
                const c = p.coords;
                const fix = { time:p.timestamp, lat:c.latitude, lng:c.longitude, accuracy:c.accuracy, speed:c.speed, heading:c.heading, alt:c.altitude };
                state.lastFix = fix;
                if (recenter) map.setView([fix.lat, fix.lng], Math.max(map.getZoom(), 18));
                setStatus(`fix @ ${new Date(fix.time).toLocaleTimeString()}`);
            }
            function onGeoError(err) { setStatus('error: ' + err.message); alert('Location error: ' + err.message + '\nUse HTTPS or localhost and grant browser permission.'); }

            // ======= PINS & PHOTOS (DATA HANDLING) =======
            async function loadPins() {
                const response = await fetch(`${BACKEND.pinsGet}?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('Could not load pins.');
                return response.json();
            }

            function addPinFeature(feat) {
                if (!feat?.geometry?.coordinates) return;
                const [lng, lat] = normLngLat(feat.geometry.coordinates);
                const { title = '', description = '' } = feat.properties || {};
                L.marker([lat, lng], { icon: pinIcon }).addTo(state.pinsLayer)
                .bindPopup(`<b>${title || 'Pin'}</b><br>${description || ''}`);
            }

            async function savePin(lng, lat, title, description) {
                const feature = { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] }, properties: { title, description, ts: Date.now() } };
                const response = await fetch(BACKEND.pinsPost, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(feature) });
                if (!response.ok) throw new Error('Failed to save pin.');
                addPinFeature(await response.json());
            }

            async function loadPhotos() {
                const response = await fetch(`${BACKEND.photosGet}?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('Could not load photos.');
                return response.json();
            }

            function addPhotoFeature(feat) {
                if (!feat?.geometry?.coordinates) return;
                const [lng, lat] = normLngLat(feat.geometry.coordinates);
                const { title = 'Photo', description = '', imageUrl } = feat.properties || {};
                const html = `<div style="max-width:220px"><b>${title}</b>${description ? `<br>${description}` : ''}${imageUrl ? `<div style="margin-top:6px"><img src="${imageUrl}" alt style="width:100px;max-height:80px;border-radius:4px;object-fit:cover;cursor:pointer" onclick="openPhotoModal('${imageUrl}')"></div>` : ''}</div>`;
                L.marker([lat, lng], { icon: photoIcon }).addTo(state.photosLayer).bindPopup(html);
            }

            async function uploadPhoto(blob, filename, lat, lng, title, description) {
                const fd = new FormData();
                fd.append('file', new File([blob], filename, { type: blob.type || 'image/jpeg' }));
                fd.append('lat', String(lat));
                fd.append('lng', String(lng));
                fd.append('title', title || '');
                fd.append('description', description || '');
                const response = await fetch(BACKEND.photoUpload, { method: 'POST', body: fd });
                if (!response.ok) throw new Error('Photo upload failed.');
                const { feature } = await response.json();
                addPhotoFeature(feature);
            }

            async function resizeImageBlob(srcBlob, maxDim = 1600, quality = 0.8) {
                const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(srcBlob); });
                const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
                const { naturalWidth: w0, naturalHeight: h0 } = img;
                const scale = Math.min(1, maxDim / Math.max(w0, h0));
                const [w, h] = [Math.max(1, Math.round(w0 * scale)), Math.max(1, Math.round(h0 * scale))];
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                const outBlob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
                if (!outBlob) throw new Error('JPEG encode failed');
                return outBlob;
            }

            // ======= CAMERA LOGIC =======
            async function camOn() {
                try {
                    const choices = [{ video: { facingMode: { ideal: 'environment' } }, audio: false }, { video: true, audio: false }];
                    let stream = null, lastErr = null;
                    for (const c of choices) {
                        try { stream = await navigator.mediaDevices.getUserMedia(c); if (stream) break; } catch (e) { lastErr = e; }
                    }
                    if (!stream) throw lastErr || new Error('No camera available');
                    state.cam.stream = stream;
                    ui.video.srcObject = stream;
                    await ui.video.play();
                    ui.camWrap.classList.add('show');
                    setStatus('camera on');
                } catch (e) {
                    alert('Camera error: ' + e.message);
                    setStatus('camera error');
                }
            }

            // ======= UI WIRING =======
            // Bottom Bar: Locate
            ui.btnLocate.onclick = () => {
                if (!navigator.geolocation) return alert('Geolocation not supported.');
                setStatus('locating...');
                navigator.geolocation.getCurrentPosition(p => onFix(p, true), onGeoError, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
            };
            
            // Bottom Bar: Add Pin (armed on click)
            let dropPinCaptureHandler = null;
            ui.btnAddPin.onclick = () => {
                state.dropPinArmed = true;
                setStatus('Click the map to place a pin…');
                if (!dropPinCaptureHandler) {
                dropPinCaptureHandler = async (ev) => {
                    if (!state.dropPinArmed) return;
                    // Prevent clicks on UI elements from placing a pin
                    if (document.getElementById('actionbar').contains(ev.target) || document.querySelector('.leaflet-control-container').contains(ev.target)) return;
                    
                    const latlng = map.mouseEventToLatLng(ev);
                    ev.originalEvent.preventDefault();
                    ev.originalEvent.stopPropagation();
                    
                    state.dropPinArmed = false;
                    const title = prompt('Pin title:', 'Pin') || 'Pin';
                    const description = prompt('Pin description (optional):', '') || '';
                    await savePin(latlng.lng, latlng.lat, title, description);
                    setStatus('pin saved');
                };
                map.on('click', dropPinCaptureHandler);
                }
            };

            // Bottom Bar: Photo
            ui.btnCamera.onclick = camOn;

            // Camera Controls
            ui.btnCamOff.onclick = () => {
                if (state.cam.stream) state.cam.stream.getTracks().forEach(t => t.stop());
                state.cam.stream = null; ui.video.srcObject = null; ui.camWrap.classList.remove('show'); setStatus('camera off');
            };

            ui.btnCamShot.onclick = async () => {
                if (!state.cam.stream) return;
                const [w, h] = [ui.video.videoWidth, ui.video.videoHeight];
                if (!w || !h) return;
                ui.canvas.width = w;
                ui.canvas.height = h;
                ui.canvas.getContext('2d').drawImage(ui.video, 0, 0, w, h);
                const rawBlob = await new Promise(res => ui.canvas.toBlob(res, 'image/png'));
                const jpegBlob = await resizeImageBlob(rawBlob);
                const fix = state.lastFix;
                const { lat, lng } = fix ? fix : map.getCenter();
                const title = prompt('Photo title (optional):', '') || 'Photo';
                const description = prompt('Photo description (optional):', '') || '';
                const filename = `photo_${Date.now()}.jpg`;
                
                setStatus('saving photo...');
                await uploadPhoto(jpegBlob, filename, lat, lng, title, description);
                setStatus('photo saved');
                ui.btnCamOff.onclick(); // Close camera after taking shot
            };

            // ======= INITIAL LOAD =======
            (async () => {
                try { 
                    (await loadPins()).features.forEach(addPinFeature);
                } catch(e) { 
                    console.error('Pins load error', e);
                    alert('Could not load existing pins.');
                }
                try { 
                    (await loadPhotos()).features.forEach(addPhotoFeature);
                } catch(e) { 
                    console.error('Photos load error', e);
                    alert('Could not load existing photos.');
                }
                setStatus('ready');
            })();
        });
		</script>

        <script>
        // --- Lazy-load Contours (CONT_6) ---
        function loadScriptOnce(url) {
        return new Promise(function(resolve, reject) {
            if (document.querySelector(`script[src="${url}"]`)) return resolve();
            var s = document.createElement('script');
            s.src = url; s.async = true; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
        }
        async function ensureContoursLoaded() {
            if (!window.layer_CONT_6 || layer_CONT_6.__loaded) return;
            try {
                await loadScriptOnce('data/CONT_6.js');
                if (typeof json_CONT_6 === 'undefined') return;
                var nl = new L.geoJson(json_CONT_6, { attribution:'', interactive:true, dataVar:'json_CONT_6', layerName:'layer_CONT_6', pane:'pane_CONT_6', onEachFeature:pop_CONT_6, style:style_CONT_6_0 });
                nl.eachLayer(ly => layer_CONT_6.addLayer(ly));
                layer_CONT_6.__loaded = true;
            } catch(e) { console.error('[contours] load error', e); }
        }
        map.on('overlayadd', e => { if (e.layer === layer_CONT_6) ensureContoursLoaded(); });
        </script>
